services:
  app:
    image: 'shedowe19/shieldpm:latest'
    container_name: shieldpm-demo
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    environment:
      DISABLE_IPV6: 'true'
      DEMO_MODE: 'true'
    volumes:
      - /opt/shieldpm:/data

  # Auto-Reset Sidecar
  # Resets the database every 60 minutes
  reset:
    image: alpine:latest
    restart: unless-stopped
    volumes:
      - /opt/shieldpm:/data
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: |
        sh -c '
        echo "Auto-Reset Service Started..."
        apk add --no-cache docker-cli
        
        # Wait for main app to initialize DB if needed
        sleep 60
        
        # Create a clean backup if it does not exist yet
        # Default path inside container is /data/shieldpm/database.sqlite
        if [ ! -f /data/shieldpm/database.sqlite.clean ]; then
            echo "Creating clean backup of database.sqlite..."
            cp /data/shieldpm/database.sqlite /data/shieldpm/database.sqlite.clean
        fi

        while true; do
            echo "Waiting 60 minutes before reset..."
            sleep 3600
            echo "Resetting database..."
            # Copy clean DB over active DB
            cp /data/shieldpm/database.sqlite.clean /data/shieldpm/database.sqlite
            # Force remove WAL/SHM locks to avoid corruption
            rm -f /data/shieldpm/database.sqlite-wal /data/shieldpm/database.sqlite-shm
            echo "Database reset complete. Restarting Application..."
            docker restart shieldpm-demo
        done
        '

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: always
    network_mode: host
    environment:
      - "TZ=Europe/Berlin"
      - "USE_WAL=true"
      - "COLLECTIONS=shedowe19/shieldpm"
    volumes:
      - /opt/shieldpm/crowdsec/conf:/etc/crowdsec
      - /opt/shieldpm/crowdsec/data:/var/lib/crowdsec/data
      - /opt/shieldpm/logs:/var/log/nginx:ro
