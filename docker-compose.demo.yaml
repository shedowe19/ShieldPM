services:
  app:
    image: 'ghcr.io/shedowe19/shieldpm:latest'
    container_name: shieldpm-demo
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    environment:
      TZ: 'Europe/Berlin'
      DISABLE_IPV6: 'true'
      DEMO_MODE: 'true'
    volumes:
      - /data/shieldpm:/data

  # Auto-Reset Sidecar
  # Resets the database every 60 minutes
  reset:
    image: debian:trixie-slim
    restart: unless-stopped
    volumes:
      - /data/shieldpm:/data
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: |
      sh -eu -c '
      echo "Auto-Reset Service Started..."
      apt-get update
      apt-get install -y --no-install-recommends docker.io sqlite3
      umask 077

      until docker exec shieldpm-demo healthcheck.sh >/dev/null 2>&1; do
          sleep 5
      done

      # SQLite backup includes committed WAL contents without copying a live file.
      if [ ! -f /data/shieldpm/database.sqlite.clean ]; then
          sqlite3 /data/shieldpm/database.sqlite ".backup /data/shieldpm/database.sqlite.clean.tmp"
          mv /data/shieldpm/database.sqlite.clean.tmp /data/shieldpm/database.sqlite.clean
      fi

      # Restart on an interrupted reset, too; the application must never write
      # while its database and journal files are being replaced.
      trap "docker start shieldpm-demo >/dev/null" EXIT
      trap "exit 1" HUP INT TERM
      while true; do
          sleep 3600
          echo "Resetting demo database..."
          cp /data/shieldpm/database.sqlite.clean /data/shieldpm/database.sqlite.reset
          docker stop --time 30 shieldpm-demo
          mv /data/shieldpm/database.sqlite.reset /data/shieldpm/database.sqlite
          rm -f /data/shieldpm/database.sqlite-wal /data/shieldpm/database.sqlite-shm
          docker start shieldpm-demo
      done
      '

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: always
    network_mode: host
    environment:
      TZ: 'Europe/Berlin'
      USE_WAL: 'true'
      COLLECTIONS: 'shedowe19/shieldpm'
    volumes:
      - /data/shieldpm/crowdsec/conf:/etc/crowdsec
      - /data/shieldpm/crowdsec/data:/var/lib/crowdsec/data
      - /data/shieldpm/nginx:/var/log/nginx:ro
