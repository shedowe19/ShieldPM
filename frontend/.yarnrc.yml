yarnPath: .yarn/releases/yarn-4.13.0.cjs

nodeLinker: node-modules

enableTelemetry: false

# react-simple-maps@3 declares react@^16-18 as peer dep but works fine with React 19.
# Suppress the resulting peer dep mismatch warnings until the package is updated.
logFilters:
  - code: YN0060
    text: "react-simple-maps"
    level: discard
  - code: YN0086
    level: discard
