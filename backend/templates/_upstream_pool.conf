{% if pool %}
upstream {{ pool.name }} {
    zone {{ pool.name }} 64k;
    {% for target in pool.targets %}
    server {{ target.host | nginxUpstreamHost }}:{{ target.port }} weight={{ target.weight }} max_fails={{ target.max_fails }} fail_timeout={{ target.fail_timeout }}s{% if target.backup %} backup{% endif %};
    {% endfor %}
    keepalive 32;
}
{% endif %}
