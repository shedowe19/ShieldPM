# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------
{% assign forward_host_last_char = forward_host | slice: -1 -%}
{% assign auth_type = access_list.meta.auth_type %}
{% if auth_type == null or auth_type == "" %}
  {% if access_list.meta.authentik_host %}
    {% assign auth_type = "authentik_proxy" %}
  {% endif %}
{% endif %}
{% assign is_oauth2 = false %}
{% if auth_type == "oauth2_proxy" %}
  {% assign is_oauth2 = true %}
{% endif %}

{% assign oidc_enabled = false %}
{% if access_list_id > 0 and auth_type == "oidc" %}
  {% assign oidc_enabled = true %}
{% endif %}

{% if enabled %}
    {% if anubis_enabled %}
        # --- Frontend Server (Public) ---
        server {
            # Standard Listen / SSL config
            {% include "_common.conf" %}

            {% if bandwidth_limit %}
            set $calculated_rate 0;
            {% endif %}

            {% if bandwidth_limit or oidc_enabled or adv_limit_req_rate > 0 or security_crowdsec %}
            access_by_lua_block {
                {% if security_crowdsec %}
                local cs = require "crowdsec"
                cs.Allow(ngx.var.remote_addr)
                {% endif %}

                {% if bandwidth_limit %}
                local limit_str = "{{ bandwidth_limit }}"
                local limit = 0
                local multiplier = 1
                local last_char = string.sub(limit_str, -1)

                if last_char == "k" or last_char == "K" then
                    multiplier = 1024
                    limit = tonumber(string.sub(limit_str, 1, -2))
                elseif last_char == "m" or last_char == "M" then
                    multiplier = 1024 * 1024
                    limit = tonumber(string.sub(limit_str, 1, -2))
                else
                    limit = tonumber(limit_str)
                end

                if limit then
                    limit = limit * multiplier
                    local ip = ngx.var.binary_remote_addr
                    local dict = ngx.shared.ip_conns

                    -- Host-Specific Keys
                    local conn_key = "{{ id }}_" .. ip
                    local rate_key = "{{ id }}_" .. ip .. "_bw"

                    -- Connection Counting
                    local new_count, err = dict:incr(conn_key, 1)
                    if not new_count then
                         dict:set(conn_key, 1)
                         new_count = 1
                    end

                    -- Bandwidth Logic: Dynamic Damping
                    local current_bw = dict:get(rate_key) or 0
                    local rate_to_alloc = 0

                    if new_count == 1 then
                        rate_to_alloc = limit
                    else
                        -- Calculate theoretical fair share
                        local fair_share = math.floor(limit / new_count)

                        if current_bw > limit then
                            -- System is over-saturated (Overshoot scenario).
                            -- Apply 50% damping to new connections to reduce aggregate overshoot,
                            -- but keep it high enough for video/streams (unlike FCFS).
                            rate_to_alloc = math.floor(fair_share * 0.5)
                        else
                            -- Under or near limit.
                            rate_to_alloc = fair_share
                        end
                    end

                    -- Safety Floor (64KB/s) to prevent timeouts/stalls
                    if rate_to_alloc < 65536 then rate_to_alloc = 65536 end
                    -- Hard Cap at limit
                    if rate_to_alloc > limit then rate_to_alloc = limit end

                    -- Update Shared BW Tracker
                    local new_bw, err = dict:incr(rate_key, rate_to_alloc)
                    if not new_bw then
                        dict:set(rate_key, rate_to_alloc)
                        new_bw = rate_to_alloc
                    end

                    -- Apply and store for cleanup
                    ngx.ctx.allocated_bw = rate_to_alloc
                    ngx.var.calculated_rate = rate_to_alloc
                end
                {% endif %}

                {% if adv_limit_req_rate and adv_limit_req_rate > 0 %}
                local limit_req = require "resty.limit.req"
                local rate = {{ adv_limit_req_rate }}
                local unit = "{{ adv_limit_req_unit }}"
                local burst = {{ adv_limit_req_burst }} or 0
                if unit == "m" then rate = rate / 60 end
                local lim, err = limit_req.new("ip_req_limit", rate, burst)
                if not lim then
                    ngx.log(ngx.ERR, "failed to instantiate a resty.limit.req object: ", err)
                    return ngx.exit(500)
                end
                local key = ngx.var.binary_remote_addr
                local delay, err = lim:incoming(key, true)
                if not delay then
                    if err == "rejected" then return ngx.exit(429) end
                    ngx.log(ngx.ERR, "failed to limit req: ", err)
                    return ngx.exit(500)
                end
                if delay >= 0.001 then ngx.sleep(delay) end
                {% endif %}

                {% if oidc_enabled %}
				local opts = {
                    discovery = "{{ access_list.meta.oidc_discovery_url }}",
                    client_id = "{{ access_list.meta.oidc_client_id }}",
                    client_secret = "{{ access_list.meta.oidc_client_secret }}",
                    redirect_uri = ngx.var.scheme .. "://" .. ngx.var.host .. "/_oauth2_callback",
                    scope = "openid profile email",
                    session_contents = {id_token=true}
                }
                local res, err = require("resty.openidc").authenticate(opts)
                if err then
                    ngx.status = 500
                    ngx.say(err)
                    ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end
                {% endif %}
            }
            {% endif %}

            {% if bandwidth_limit %}
            log_by_lua_block {
                local ip = ngx.var.binary_remote_addr
                local dict = ngx.shared.ip_conns

                -- Host-Specific Keys
                local conn_key = "{{ id }}_" .. ip
                local rate_key = "{{ id }}_" .. ip .. "_bw"

                dict:incr(conn_key, -1)

                local allocated = ngx.ctx.allocated_bw
                if allocated then
                    local new_val, err = dict:incr(rate_key, -allocated)
                    -- Auto-cleanup negative values
                    if new_val and new_val < 0 then
                        dict:set(rate_key, 0)
                    end
                end
            }
            {% endif %}

            {% if access_list_id > 0 %}
              {% if access_list.mtls_enabled %}
                {% if access_list.mtls_use_internal %}
                    ssl_client_certificate /data/tls/internal/root_ca.crt;
                    ssl_verify_client on;
                {% elsif access_list.mtls_certificate %}
                    ssl_client_certificate /data/access/{{ access_list_id }}.crt;
                    ssl_verify_client on;
                {% endif %}
              {% endif %}
              {% if auth_type == "authentik_proxy" %}
                auth_request     /outpost.goauthentik.io/auth/nginx;
                error_page       401 = @goauthentik_proxy_signin;
                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header       Set-Cookie $auth_cookie;
                auth_request_set $authentik_host $http_host;
                auth_request_set $authentik_uri $request_uri;
                auth_request_set $authentik_proto $scheme;
                proxy_set_header X-Authentik-Host $authentik_host;
                proxy_set_header X-Authentik-Uri $authentik_uri;
                proxy_set_header X-Authentik-Proto $authentik_proto;
              {% endif %}
              {% if auth_type == "oauth2_proxy" %}
                {% assign oauth2_prefix = access_list.meta.oauth2_proxy_prefix | default: "/oauth2/" %}
                {% assign oauth2_prefix_no_slash = oauth2_prefix | remove_first: "/" | remove_last: "/" %}
                auth_request     {{ oauth2_prefix }}auth;
                error_page       401 403 = @oauth2_proxy_signin;

                # pass information via X-User and X-Email headers to backend,
                # requires running with --set-xauthrequest flag
                auth_request_set $user   $upstream_http_x_auth_request_user;
                auth_request_set $email  $upstream_http_x_auth_request_email;
                auth_request_set $groups $upstream_http_x_auth_request_groups;
                auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;
                proxy_set_header X-User  $user;
                proxy_set_header X-Email $email;
                proxy_set_header X-Groups $groups;
                proxy_set_header X-Preferred-Username $preferred_username;

                # if you enabled --pass-access-token, this will pass the token to the backend
                auth_request_set $token  $upstream_http_x_auth_request_access_token;
                proxy_set_header X-Access-Token $token;

                # if you enabled --cookie-refresh, this is needed for it to work with auth_request
                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header Set-Cookie $auth_cookie;
              {% endif %}
              {% if access_list.items.length > 0 %}
                auth_basic            "Authorization required";
                auth_basic_user_file  /data/access/{{ access_list_id }};
                {% if access_list.pass_auth %}
                  proxy_set_header Authorization "";
                {% endif %}
              {% endif %}
              {% for client in access_list.clients %}
                {{client | nginxAccessRule}}
              {% endfor %}
              # auth_type={{ auth_type }} is_oauth2={{ is_oauth2 }}
              {% unless is_oauth2 %}
                {% if access_list.clients.length > 0 %}
                deny all;
                {% elsif access_list.satisfy_any %}
                  {% unless oidc_enabled %}
                  deny all;
                  {% endunless %}
                {% endif %}
              {% endunless %}
              {% unless is_oauth2 %}
                {% if access_list.satisfy_any %}
                  satisfy any;
                {% else %}
                  satisfy all;
                {% endif %}
              {% endunless %}
            {% endif %}

            {% if block_exploits or env.DEMO_MODE == "true" %}
              modsecurity on;
              {% if caching_enabled %}
                modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity-crs.conf;
              {% else %}
                modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity.conf;
              {% endif %}
            {% endif %}

            {% if maintenance_mode %}
              location / {
                root /html;
                try_files /maintenance.html =503;
                sub_filter '<!-- maintenance_data_injection_point -->' '<div id="m-data" data-end="{{ maintenance_end }}" data-reason="{{ maintenance_reason | escape }}"></div>';
                sub_filter_once on;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
              }
            {% else %}
            # Proxy everything to Anubis
            location / {
                proxy_pass http://unix:/run/anubis/nginx.sock;
                {% if disable_buffering %}
                proxy_buffering off;
                proxy_request_buffering off;
                {% endif %}
                {% if bandwidth_limit %}
                limit_rate $calculated_rate;
                {% endif %}
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-ShieldPM-Host $host;

                # Websocket Support
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
            {% endif %}

            {% if maintenance_on_failure %}
            proxy_intercept_errors on;
            error_page 502 504 @maintenance_fallback;
            {% endif %}

            location @maintenance_fallback {
                root /html;
                try_files /maintenance.html =502;
                internal;
            }

            {% if access_list_id > 0 and auth_type == "authentik_proxy" %}
            location /outpost.goauthentik.io {
                proxy_pass              {{ access_list.meta.authentik_host }}/outpost.goauthentik.io;
                proxy_set_header        Host $host;
                proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
                add_header              Set-Cookie $auth_cookie;
                auth_request_set        $auth_cookie $upstream_http_set_cookie;
                proxy_pass_request_body off;
                proxy_set_header        Content-Length "";
            }

            location @goauthentik_proxy_signin {
                internal;
                add_header Set-Cookie $auth_cookie;
                return 302 /outpost.goauthentik.io/start?rd=$request_uri;
            }
            {% endif %}

            {% if access_list_id > 0 and auth_type == "oauth2_proxy" %}
            {% assign oauth2_prefix = access_list.meta.oauth2_proxy_prefix | default: "/oauth2/" %}
            location {{ oauth2_prefix }} {
                auth_request off;
                proxy_pass       http://unix:/run/shieldpm/oauth2-proxy-{{ access_list_id }}.sock;
                proxy_set_header Host                    $host;
                proxy_set_header X-Real-IP               $remote_addr;
                proxy_set_header X-Scheme                $scheme;
                proxy_set_header X-Auth-Request-Redirect $request_uri;
            }

            location = {{ oauth2_prefix }}auth {
                auth_request off;
                proxy_pass http://unix:/run/shieldpm/oauth2-proxy-{{ access_list_id }}.sock:{{ oauth2_prefix }}auth;
                proxy_set_header Host             $host;
                proxy_set_header X-Real-IP        $remote_addr;
                proxy_set_header X-Forwarded-Uri  $request_uri;
                proxy_set_header X-Scheme         $scheme;
                # nginx auth_request includes headers but not body
                proxy_set_header Content-Length   "";
                proxy_pass_request_body           off;
            }

            location @oauth2_proxy_signin {
                internal;
                add_header Set-Cookie $auth_cookie;
                return 302 {{ oauth2_prefix }}start?rd=$request_uri;
            }
            {% endif %}

            {{ advanced_config }}
        }

        # --- Backend Server (Internal) ---
        server {
            listen unix:/run/nginx/anubis-upstream.sock;
            server_name {{ domain_names | join: " " }};
            
            # Trust Anubis IP (it sends X-Real-IP)
            set_real_ip_from unix:;
            real_ip_header X-Real-IP;

            {% include "_proxy_logic.conf" %}
        }
    {% else %}
        # --- Standard Server ---
        server {
            {% include "_common.conf" %}
            {% include "_proxy_logic.conf" %}
        }
    {% endif %}
{% endif %}
