# ----------------------------------------------------------------------
# {{ domain_names | join: ", " }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------
{% assign forward_host_last_char = forward_host | slice: -1 -%}
{% assign auth_type = access_list.meta.auth_type %}
{% if auth_type == null or auth_type == "" %}
  {% if access_list.meta.authentik_host %}
    {% assign auth_type = "authentik_proxy" %}
  {% endif %}
{% endif %}

{% assign oidc_enabled = false %}
{% if access_list_id > 0 and auth_type == "oidc" %}
  {% assign oidc_enabled = true %}
{% endif %}

{% if enabled %}
    {% if anubis_enabled %}
        # --- Frontend Server (Public) ---
        server {
            # Standard Listen / SSL config
            {% include "_common.conf" %}

            {% if bandwidth_limit %}
            set $calculated_rate 0;
            {% endif %}

            {% if bandwidth_limit or oidc_enabled or adv_limit_req_rate > 0 or security_crowdsec %}
            access_by_lua_block {
                {% if security_crowdsec %}
                local cs = require "crowdsec"
                cs.Allow(ngx.var.remote_addr)
                {% endif %}

                {% if adv_limit_req_rate and adv_limit_req_rate > 0 %}
                local limit_req = require "resty.limit.req"
                local rate = {{ adv_limit_req_rate }}
                local unit = "{{ adv_limit_req_unit }}"
                local burst = {{ adv_limit_req_burst }} or 0
                if unit == "m" then rate = rate / 60 end
                local lim, err = limit_req.new("ip_req_limit", rate, burst)
                if not lim then
                    ngx.log(ngx.ERR, "failed to instantiate a resty.limit.req object: ", err)
                    return ngx.exit(500)
                end
                local key = ngx.var.binary_remote_addr
                local delay, err = lim:incoming(key, true)
                if not delay then
                    if err == "rejected" then return ngx.exit(429) end
                    ngx.log(ngx.ERR, "failed to limit req: ", err)
                    return ngx.exit(500)
                end
                if delay >= 0.001 then ngx.sleep(delay) end
                {% endif %}

                {% if oidc_enabled %}
                if ngx.var.uri == "/ws" then return end
                local opts = {
                    discovery = "{{ access_list.meta.oidc_discovery_url }}",
                    client_id = "{{ access_list.meta.oidc_client_id }}",
                    client_secret = "{{ access_list.meta.oidc_client_secret }}",
                    redirect_uri = ngx.var.scheme .. "://" .. ngx.var.host .. "/_oauth2_callback",
                    scope = "openid profile email",
                    session_contents = {id_token=true}
                }
                local res, err = require("resty.openidc").authenticate(opts)
                if err then
                    ngx.status = 500
                    ngx.say(err)
                    ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end
                {% endif %}
            }
            {% endif %}

            {% if access_list_id > 0 %}
              {% if access_list.mtls_enabled %}
                {% if access_list.mtls_use_internal %}
                    ssl_client_certificate /data/tls/internal/root_ca.crt;
                    ssl_verify_client on;
                {% elsif access_list.mtls_certificate %}
                    ssl_client_certificate /data/access/{{ access_list_id }}.crt;
                    ssl_verify_client on;
                {% endif %}
              {% endif %}
              {% if auth_type == "authentik_proxy" %}
                auth_request     /outpost.goauthentik.io/auth/nginx;
                error_page       401 = @goauthentik_proxy_signin;
                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header       Set-Cookie $auth_cookie;
                auth_request_set $authentik_host $http_host;
                auth_request_set $authentik_uri $request_uri;
                auth_request_set $authentik_proto $scheme;
                proxy_set_header X-Authentik-Host $authentik_host;
                proxy_set_header X-Authentik-Uri $authentik_uri;
                proxy_set_header X-Authentik-Proto $authentik_proto;
              {% endif %}
              {% if access_list.items.length > 0 %}
                auth_basic            "Authorization required";
                auth_basic_user_file  /data/access/{{ access_list_id }};
                {% if access_list.pass_auth %}
                  proxy_set_header Authorization "";
                {% endif %}
              {% endif %}
              {% for client in access_list.clients %}
                {{client | nginxAccessRule}}
              {% endfor %}
              {% unless oidc_enabled %}
              deny all;
              {% endunless %}
              {% if access_list.satisfy_any %}
                satisfy any;
              {% else %}
                satisfy all;
              {% endif %}
            {% endif %}

            {% if block_exploits or env.DEMO_MODE == "true" %}
              modsecurity on;
              {% if caching_enabled %}
                modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity-crs.conf;
              {% else %}
                modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity.conf;
              {% endif %}
            {% endif %}

            {% if maintenance_mode %}
              location / {
                root /html;
                try_files /maintenance.html =503;
                sub_filter '<!-- maintenance_data_injection_point -->' '<div id="m-data" data-end="{{ maintenance_end }}" data-reason="{{ maintenance_reason | escape }}"></div>';
                sub_filter_once on;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
              }
            {% else %}
            # Proxy everything to Anubis
            location / {
                proxy_pass http://unix:/run/anubis/nginx.sock;
                {% if disable_buffering %}
                proxy_buffering off;
                proxy_request_buffering off;
                {% endif %}
                {% if bandwidth_limit %}
                limit_rate $calculated_rate;
                {% endif %}
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header X-ShieldPM-Host $host;

                # Websocket Support
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
            {% endif %}

            {% if maintenance_on_failure %}
            proxy_intercept_errors on;
            error_page 502 504 @maintenance_fallback;
            {% endif %}

            location @maintenance_fallback {
                root /html;
                try_files /maintenance.html =502;
                internal;
            }

            {% if access_list_id > 0 and auth_type == "authentik_proxy" %}
            location /outpost.goauthentik.io {
                proxy_pass              {{ access_list.meta.authentik_host }}/outpost.goauthentik.io;
                proxy_set_header        Host $host;
                proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
                add_header              Set-Cookie $auth_cookie;
                auth_request_set        $auth_cookie $upstream_http_set_cookie;
                proxy_pass_request_body off;
                proxy_set_header        Content-Length "";
            }

            location @goauthentik_proxy_signin {
                internal;
                add_header Set-Cookie $auth_cookie;
                return 302 /outpost.goauthentik.io/start?rd=$request_uri;
            }
            {% endif %}

            {{ advanced_config }}
        }

        # --- Backend Server (Internal) ---
        server {
            listen unix:/run/nginx/anubis-upstream.sock;
            server_name {{ domain_names | join: " " }};
            
            # Trust Anubis IP (it sends X-Real-IP)
            set_real_ip_from unix:;
            real_ip_header X-Real-IP;

            {% include "_proxy_logic.conf" %}
        }
    {% else %}
        # --- Standard Server ---
        server {
            {% include "_common.conf" %}
            {% include "_proxy_logic.conf" %}
        }
    {% endif %}
{% endif %}
