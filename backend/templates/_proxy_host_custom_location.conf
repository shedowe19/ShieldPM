{% assign path_first_char = path | slice: 0 -%}
{% assign path_last_char = path | slice: -1 -%}
{% assign forward_host_last_char = forward_host | slice: -1 -%}

{% if path != "/" and path_first_char == "/" and path_last_char == "/" %}
  location {{ path | remove_last: "/" }} {
    absolute_redirect off;
    return 301 {{ path }};
  }
{% endif %}

location {{ path }} {
  set $forward_scheme "{{ forward_scheme }}";
  set $server         "{{ forward_host }}";
  set $port           "{{ forward_port }}";
  set $forward_path   "{{ forward_path }}";

  {{ advanced_config }}
    
  {% if forward_scheme == "http" or forward_scheme == "https" %}
    include conf.d/include/proxy-headers.conf;
    {% unless anubis_enabled %}{% include "_proxy_auth_headers.conf" %}{% endunless %}
    {% if forward_query != null and forward_query != "" %}
      set $args "$args&{{ forward_query }}";
      proxy_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$uri$is_args$args{% endif %};
    {% else %}
      proxy_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};
    {% endif %}
  {% elsif forward_scheme == "grpc" or forward_scheme == "grpcs" %}
    include conf.d/include/grpc-headers.conf;
    {% unless anubis_enabled %}{% include "_proxy_auth_headers.conf", auth_header_directive: "grpc_set_header" %}{% endunless %}
    grpc_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};
  {% elsif forward_scheme == "path" %}
    {% if managed_web_root %}
      disable_symlinks on;
    {% endif %}
    if ($uri ~ /\.git(?:/|$)) {
      return 403;
    }
    {% if forward_host_last_char == "/" %}
      alias {{ forward_host }};
    {% else %}
      root {{ forward_host }};
    {% endif %}
    {% if forward_path != null %}
      location ~* \.php(?:$|/) {
        fastcgi_split_path_info ^(.*\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass unix:/run/shieldpm/php{{ forward_port }}.sock;
      }
    {% endif %}
  {% endif %}
}
