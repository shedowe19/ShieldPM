{% if wasm %}
{% if wasm.preview_summary %}# Preview policy: {{ wasm.preview_summary }}
{% endif %}
# Trusted Wasm filters: {% for filter in meta.wasm_filters %}{% if filter.enabled %}{{ filter.id }}/{{ filter.kind }} {% endif %}{% endfor %}
header_filter_by_lua_block {
    local wasm_dispatcher = package.loaded[{{ wasm.dispatcher_path | luaString }}]
    if wasm_dispatcher then wasm_dispatcher.header_filter({{ wasm.configuration_path | luaString }}) end
}
body_filter_by_lua_block {
    local wasm_dispatcher = package.loaded[{{ wasm.dispatcher_path | luaString }}]
    if wasm_dispatcher then wasm_dispatcher.body_filter() end
}
{% endif %}
