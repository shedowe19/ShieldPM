proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host$is_request_port$request_port;
proxy_set_header Host {% if pool.host_header %}"{{ pool.host_header | nginxUpstreamHost }}"{% else %}$host$is_request_port$request_port{% endif %};
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $spm_pool_connection_{{ id }};
proxy_set_header X-Forwarded-URI $request_uri;
proxy_set_header X-Original-Method $request_method;
proxy_set_header X-Forwarded-Method $request_method;
proxy_set_header X-Original-URL $scheme://$host$is_request_port$request_port$request_uri;
proxy_set_header Accept-Encoding "";
proxy_set_header Early-Data $ssl_early_data;
