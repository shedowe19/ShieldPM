{% if upload_relay_enabled %}
# Resumable uploads stay below the public CDN limit. Chunks are persisted by
# ShieldPM and the completed raw body is sent directly to this private origin.
location = {{ upload_relay_path }} {
    client_max_body_size {{ upload_relay_chunk_size }};
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    {% if access_list.pass_auth == false or access_list.pass_auth == 0 %}
    proxy_set_header Authorization "";
    {% endif %}
    proxy_pass http://unix:/run/shieldpm/shieldpm.sock:/nginx/proxy-hosts/{{ id }}/upload-relay;
}

location ^~ {{ upload_relay_path }}/ {
    client_max_body_size {{ upload_relay_chunk_size }};
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    {% if access_list.pass_auth == false or access_list.pass_auth == 0 %}
    proxy_set_header Authorization "";
    {% endif %}
    proxy_pass http://unix:/run/shieldpm/shieldpm.sock:/nginx/proxy-hosts/{{ id }}/upload-relay/;
}
{% endif %}
