{% if upload_relay_enabled %}
# Preserve the original request target for every upload. The configured private
# upstream remains the only destination; an upload client does not need a second
# target path in ShieldPM.
{% if anubis_public %}
{% assign upload_proxy_target = "http://unix:/run/shieldpm/anubis.sock" %}
{% else %}
{% assign upload_proxy_target = forward_scheme | append: "://" | append: forward_host %}
{% if forward_port != null %}
{% assign upload_proxy_target = upload_proxy_target | append: ":" | append: forward_port %}
{% endif %}
{% endif %}

# Nextcloud's WebDAV chunking already carries its final Destination header.
# Retain WAF rules while raising only the protocol's body limits.
location ^~ /remote.php/dav/uploads/ {
    client_max_body_size 104857600;
    modsecurity_rules 'SecRequestBodyLimit 104857600';
    modsecurity_rules 'SecRequestBodyNoFilesLimit 104857600';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    {% if anubis_public %}
    {% include "_proxy_auth_headers.conf" %}
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-ShieldPM-Host $host;
    {% else %}
    include conf.d/include/proxy-headers.conf;
    {% include "_proxy_auth_headers.conf" %}
    {% endif %}
    {% if access_list.pass_auth == false or access_list.pass_auth == 0 %}
    proxy_set_header Authorization "";
    {% endif %}
    proxy_pass {{ upload_proxy_target }}{% unless anubis_public %}$request_uri{% endunless %};
}

# A configured generic upload endpoint retains WAF inspection while using a
# protocol-sized body limit. A tus-capable upstream owns its own final target.
location = {{ upload_relay_path }} {
    client_max_body_size {{ upload_relay_chunk_size }};
    modsecurity_rules 'SecRequestBodyLimit {{ upload_relay_chunk_size }}';
    modsecurity_rules 'SecRequestBodyNoFilesLimit {{ upload_relay_chunk_size }}';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    {% if anubis_public %}
    {% include "_proxy_auth_headers.conf" %}
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-ShieldPM-Host $host;
    {% else %}
    include conf.d/include/proxy-headers.conf;
    {% include "_proxy_auth_headers.conf" %}
    {% endif %}
    {% if access_list.pass_auth == false or access_list.pass_auth == 0 %}
    proxy_set_header Authorization "";
    {% endif %}
    proxy_pass {{ upload_proxy_target }}{% unless anubis_public %}$request_uri{% endunless %};
}

location ^~ {{ upload_relay_path }}/ {
    client_max_body_size {{ upload_relay_chunk_size }};
    modsecurity_rules 'SecRequestBodyLimit {{ upload_relay_chunk_size }}';
    modsecurity_rules 'SecRequestBodyNoFilesLimit {{ upload_relay_chunk_size }}';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    {% if anubis_public %}
    {% include "_proxy_auth_headers.conf" %}
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-ShieldPM-Host $host;
    {% else %}
    include conf.d/include/proxy-headers.conf;
    {% include "_proxy_auth_headers.conf" %}
    {% endif %}
    {% if access_list.pass_auth == false or access_list.pass_auth == 0 %}
    proxy_set_header Authorization "";
    {% endif %}
    proxy_pass {{ upload_proxy_target }}{% unless anubis_public %}$request_uri{% endunless %};
}
{% endif %}