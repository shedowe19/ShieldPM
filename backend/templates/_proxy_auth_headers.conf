{% assign header_auth_type = access_list.meta.auth_type %}
{% if header_auth_type == null or header_auth_type == "" %}
  {% if access_list.meta.authentik_host %}
    {% assign header_auth_type = "authentik_proxy" %}
  {% endif %}
{% endif %}
{% assign header_directive = auth_header_directive | default: "proxy_set_header" %}
{% if access_list_id > 0 %}
  # Set authentication headers in this location: Nginx does not merge parent header sets.
  {% if header_auth_type == "oauth2_proxy" %}
    {{ header_directive }} X-User $user;
    {{ header_directive }} X-Email $email;
    {{ header_directive }} X-Groups $groups;
    {{ header_directive }} X-Preferred-Username $preferred_username;
    {{ header_directive }} X-Access-Token $token;
  {% elsif header_auth_type == "authentik_proxy" %}
    {{ header_directive }} X-Authentik-Host $authentik_host;
    {{ header_directive }} X-Authentik-Uri $authentik_uri;
    {{ header_directive }} X-Authentik-Proto $authentik_proto;
  {% endif %}
  {% if access_list.items.length > 0 %}
  {% if access_list.pass_auth == false or access_list.pass_auth == 0 %}
    {{ header_directive }} Authorization "";
  {% endif %}
  {% endif %}
{% endif %}
