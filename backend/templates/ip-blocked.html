<!doctype html>
<html lang="%{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>%{title} · ShieldPM</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:#071018;color:#e7edf4;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-image:radial-gradient(ellipse at 12% 8%,#153544 0,transparent 50%),radial-gradient(ellipse at 90% 88%,#172b32 0,transparent 40%)}main{width:min(100%,690px)}.brand{display:flex;align-items:center;gap:10px;color:#aabcc9;font-size:14px;font-weight:650;letter-spacing:.05em;margin-bottom:24px}.brand-mark{display:grid;place-items:center;width:28px;height:32px;border:1px solid #69d6c4;border-radius:9px 9px 15px 15px;color:#69d6c4;font-size:18px}.card{padding:40px;border:1px solid #2b404c;border-radius:24px;background:#0d1b25;box-shadow:0 24px 90px #0005}.badge{display:inline-flex;align-items:center;gap:9px;padding:6px 11px;border:1px solid #734a39;border-radius:30px;background:#402c23;color:#f4bb93;font-size:12px;font-weight:700;letter-spacing:.09em}.dot{width:6px;height:6px;background:#edac81;border-radius:50%}h1{font-size:clamp(28px,5vw,40px);line-height:1.18;letter-spacing:-.025em;margin:22px 0 12px}.subtitle{margin:0 0 28px;color:#aabcc9}.reason{padding:20px 22px;background:#152631;border:1px solid #2a424f;border-radius:14px}.eyebrow{font-size:12px;font-weight:700;color:#80d2c4;letter-spacing:.07em;text-transform:uppercase}.reason p{margin:8px 0 0;overflow-wrap:anywhere}.message{margin:22px 0;color:#aabcc9;font-size:14px;overflow-wrap:anywhere}dl{margin:25px 0 0;border-top:1px solid #2b404c}dl>div{display:grid;grid-template-columns:155px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid #243844}dt{color:#8da7b7;font-size:13px}dd{margin:0;font-size:13px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.contact{display:inline-flex;justify-content:center;padding:12px 19px;border-radius:10px;background:#8fe4d1;color:#09241f;font-size:14px;font-weight:700;text-decoration:none;margin-top:26px}.contact:hover{background:#b1f3e5}.contact:focus-visible{outline:3px solid #fff;outline-offset:4px}[hidden]{display:none!important}footer{color:#849ba9;font-size:12px;text-align:center;margin-top:21px;padding:0 10px}@media(max-width:520px){body{padding:22px 14px}.card{padding:26px 23px;border-radius:18px}dl>div{grid-template-columns:1fr;gap:5px}.contact{width:100%}}
</style>
</head>
<body>
<main>
<div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> ShieldPM</div>
<section class="card" aria-labelledby="title">
<div class="badge"><span class="dot" aria-hidden="true"></span> IP FIREWALL · 403</div>
<h1 id="title">%{title}</h1>
<p class="subtitle">%{subtitle}</p>
<div class="reason"><div class="eyebrow">%{reason_label}</div><p>%{reason}</p></div>
<p class="message">%{message}</p>
<dl>
<div><dt>%{source_label}</dt><dd>%{source}</dd></div>
<div %{country_hidden}><dt>%{country_label}</dt><dd>%{country}</dd></div>
<div><dt>%{ip_label}</dt><dd>%{ip}</dd></div>
<div><dt>%{host_label}</dt><dd>%{host}</dd></div>
<div><dt>%{request_label}</dt><dd>%{request}</dd></div>
</dl>
<a class="contact" href="%{support}" rel="noreferrer" %{contact_hidden}>%{contact_label}</a>
</section>
<footer>%{footer}</footer>
</main>
</body>
</html>
