{% if firewall %}
# Mandatory check in the public server rewrite phase, independent of satisfy any.
# Real-IP must be configured at http/server scope, before this phase.
set $spm_fw_{{ firewall.id }}_reason "";
set $spm_fw_{{ firewall.id }}_source "";
{% if firewall.has_country_info %}set $spm_fw_{{ firewall.id }}_country_info "";
{% endif %}
{% if firewall.has_asn_info %}set $spm_fw_{{ firewall.id }}_asn_info "";
set $spm_fw_{{ firewall.id }}_asn_org_info "";
{% endif %}
error_page 470 = @spm_ip_blocked_{{ firewall.id }};
if ($spm_fw_{{ firewall.id }}_blocked) {
    return 470;
}
location @spm_ip_blocked_{{ firewall.id }} {
    internal;
    recursive_error_pages off;
    auth_request off;
    auth_basic off;
    allow all;
    satisfy all;
    modsecurity off;
    access_by_lua_block { }
    access_log /data/logs/ip_firewall_{{ firewall.id }}.log spm_fw_{{ firewall.id }} if=$spm_fw_{{ firewall.id }}_blocked;
    content_by_lua_block {
        -- 470 is reserved for this internal redirect; an unrelated response is not a firewall denial.
        if ngx.var.spm_fw_{{ firewall.id }}_blocked ~= "1" then
            return ngx.exit(470)
        end
        local rules = {
            {% for rule in firewall.details %}[{{ rule.id }}] = {reason={{ rule.reason | luaString }}, source={{ rule.source | luaString }}, source_type={{ rule.source_type | luaString }}},
            {% endfor %}
        }
        local rule = rules[tonumber(ngx.var.spm_fw_{{ firewall.id }}_hit)] or {}
        local de = string.sub(string.lower(ngx.var.http_accept_language or ""), 1, 2) == "de"
        local country = ""
        {% if firewall.has_country_info %}
        -- Optional information survives a restart without the global lookup definition.
        local raw_country = ngx.var.geoip2_country_code
        if raw_country ~= nil then
            local code = string.upper(raw_country)
            local known_countries = "|{% for code in firewall.known_country_codes %}{{ code }}|{% endfor %}"
            country = #code == 2 and string.find(known_countries, "|" .. code .. "|", 1, true) and code or "XX"
        end
        ngx.var.spm_fw_{{ firewall.id }}_country_info = country
        {% endif %}
        local asn = nil
        local organization = ""
        {% if firewall.has_asn_info %}
        local raw_asn = tonumber(ngx.var.spm_geoip2_asn or "")
        if raw_asn and raw_asn >= 1 and raw_asn <= 4294967295 and raw_asn == math.floor(raw_asn) then
            asn = raw_asn
        end
        organization = ngx.var.spm_geoip2_asn_org or ""
        ngx.var.spm_fw_{{ firewall.id }}_asn_info = asn and string.format("%.0f", asn) or ""
        ngx.var.spm_fw_{{ firewall.id }}_asn_org_info = organization
        {% endif %}
        local reason = rule.reason or ""
        if reason == "" then
            if rule.source_type == "asn" then
                local system = "AS" .. string.format("%.0f", asn or 0)
                reason = de and ("Die IP-Adresse gehört zum gesperrten autonomen System " .. system .. ". Der Betreiber schränkt Zugriffe aus diesem Netzwerk ein.") or ("This IP address belongs to the blocked autonomous system " .. system .. ". The operator restricts access from this network.")
            elseif rule.source_type == "country" then
                reason = de and ("Die IP-Adresse wird dem gesperrten Land " .. country .. " zugeordnet. Der Betreiber schränkt Zugriffe aus diesem Land ein.") or ("This IP address is assigned to the blocked country " .. country .. ". The operator restricts access from this country.")
            elseif rule.source_type == "country_unknown" then
                reason = de and "Das Land dieser IP-Adresse konnte nicht ermittelt werden. Dieser Betreiber sperrt Zugriffe mit unbekannter Länderzuordnung." or "The country of this IP address could not be determined. This operator blocks requests with unknown country assignment."
            else
                reason = de and "Die IP-Adresse ist durch eine Zugriffsregel dieser Website gesperrt." or "This IP address is blocked by an access rule for this website."
            end
        end
        local source = rule.source or ""
        if source == "" then
            if rule.source_type == "asn" then
                source = de and "ASN-Regel" or "ASN rule"
            elseif rule.source_type == "country" or rule.source_type == "country_unknown" then
                source = de and "GeoIP-Länderregel" or "GeoIP country rule"
            else
                source = de and "Manuelle IP-Sperre" or "Manual IP block"
            end
        end
        local message = {{ firewall.public_message | luaString }}
        if message == "" then
            message = de and "Der Betreiber schränkt den Zugriff für dieses Netzwerk ein. Ein Listentreffer allein bedeutet nicht, dass ein Angriff stattgefunden hat." or "The website operator restricts access from this network. A list match alone does not mean an attack occurred."
        end
        local support = {{ firewall.support_url | luaString }}
        ngx.var.spm_fw_{{ firewall.id }}_reason = reason
        ngx.var.spm_fw_{{ firewall.id }}_source = source
        ngx.status = ngx.HTTP_FORBIDDEN
        ngx.header["Cache-Control"] = "no-store, no-cache, must-revalidate"
        ngx.header["Pragma"] = "no-cache"
        ngx.header["X-Content-Type-Options"] = "nosniff"
        ngx.header["X-Request-ID"] = ngx.var.request_id
        local accept = string.lower(ngx.var.http_accept or "")
        if string.find(accept, "application/json", 1, true) and not string.find(accept, "text/html", 1, true) then
            ngx.header.content_type = "application/json; charset=utf-8"
            ngx.say(require("cjson.safe").encode({
                error = "ip_blocked", reason = reason, message = message, source = source,
                ip = ngx.var.remote_addr, host = ngx.var.host, request_id = ngx.var.request_id,
                country_code = country ~= "" and country or nil,
                asn = asn, asn_organization = organization ~= "" and organization or nil,
                support_url = support ~= "" and support or nil
            }))
            return ngx.exit(ngx.OK)
        end
        local function escape(value)
            return (tostring(value or ""):gsub("[&<>\"']", {
                ["&"]="&amp;", ["<"]="&lt;", [">"]="&gt;", ['"']="&quot;", ["'"]="&#39;"
            }))
        end
        local labels = de and {
            lang="de", title="Zugriff eingeschränkt", subtitle="Diese Verbindung wurde durch die IP-Firewall geschützt.",
            reason_label="Begründung", source_label="Regel / Liste", ip_label="Deine IP-Adresse", host_label="Website",
            request_label="Vorgangsnummer", contact_label="Betreiber kontaktieren", footer="Bei einer Rückfrage gib bitte die Vorgangsnummer an."
        } or {
            lang="en", title="Access restricted", subtitle="This connection was protected by the IP firewall.",
            reason_label="Reason", source_label="Rule / list", ip_label="Your IP address", host_label="Website",
            request_label="Request ID", contact_label="Contact the operator", footer="Please include the request ID when asking for assistance."
        }
        labels.reason = reason
        labels.message = message
        labels.source = source
        labels.ip = ngx.var.remote_addr
        labels.host = ngx.var.host
        labels.request = ngx.var.request_id
        labels.support = support
        labels.contact_hidden = support == "" and "hidden" or ""
        labels.country_label = de and "Erkanntes Land (ISO)" or "Detected country (ISO)"
        labels.country = country == "XX" and (de and "Unbekannt (XX)" or "Unknown (XX)") or country
        labels.country_hidden = country == "" and "hidden" or ""
        labels.asn_label = de and "Autonomes System (ASN)" or "Autonomous system (ASN)"
        labels.asn = asn and ("AS" .. string.format("%.0f", asn)) or (de and "Unbekannt" or "Unknown")
        labels.asn_hidden = {% if firewall.has_asn_info %}ngx.var.spm_geoip2_asn ~= nil and "" or "hidden"{% else %}"hidden"{% endif %}
        labels.asn_organization_label = de and "Netzwerkbetreiber" or "Network operator"
        labels.asn_organization = organization
        labels.asn_organization_hidden = organization == "" and "hidden" or ""
        ngx.header.content_type = "text/html; charset=utf-8"
        ngx.header["Content-Security-Policy"] = "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
        local page = {{ firewall.page | luaPageString }}
        ngx.say((page:gsub("%%{([a-z_]+)}", function(key) return escape(labels[key]) end)))
        return ngx.exit(ngx.OK)
    }
}
{% endif %}
