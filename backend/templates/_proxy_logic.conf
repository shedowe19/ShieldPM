    set $port           "{{ forward_port }}";
    set $forward_path   "{{ forward_path }}";

    {% if forward_scheme == "path" %}
    root {{ forward_host }};
    {% endif %}

    {% if turbo_loader %}
    # --- Turbo-Loader Interception ---
    location = /_turbo_loader {
        internal;
        root /html;
        try_files /turbo_loader.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    set $do_turbo 0;
    if ($uri ~* \.(mp4|mkv|zip|iso|bin|rar|tar|gz|7z)$) {
        set $do_turbo 1;
    }
    if ($arg_turbo = "0") {
        set $do_turbo 0;
    }
    if ($do_turbo = 1) {
        rewrite ^ /_turbo_loader last;
    }
    # ---------------------------------
    {% endif %}

    {% unless anubis_enabled %}
    {% if bandwidth_limit or oidc_enabled or adv_limit_req_rate > 0 or security_crowdsec %}

    access_by_lua_block {
        {% if security_crowdsec %}
        local cs = require "crowdsec"
        cs.Allow(ngx.var.remote_addr)
        {% endif %}

        {% if bandwidth_limit %}
        local limit_str = "{{ bandwidth_limit }}"
        local limit = 0
        local multiplier = 1
        local last_char = string.sub(limit_str, -1)

        if last_char == "k" or last_char == "K" then
            multiplier = 1024
            limit = tonumber(string.sub(limit_str, 1, -2))
        elseif last_char == "m" or last_char == "M" then
            multiplier = 1024 * 1024
            limit = tonumber(string.sub(limit_str, 1, -2))
        else
            limit = tonumber(limit_str)
        end

        if limit then
            limit = limit * multiplier
            local ip = ngx.var.binary_remote_addr
            local dict = ngx.shared.ip_conns

            -- Host-Specific Keys
            local conn_key = "{{ id }}_" .. ip
            local rate_key = "{{ id }}_" .. ip .. "_bw"

            -- Connection Counting
            local new_count, err = dict:incr(conn_key, 1)
            if not new_count then
                 dict:set(conn_key, 1)
                 new_count = 1
            end

            -- Bandwidth Logic: Dynamic Damping
            local current_bw = dict:get(rate_key) or 0
            local rate_to_alloc = 0

            if new_count == 1 then
                rate_to_alloc = limit
            else
                -- Calculate theoretical fair share
                local fair_share = math.floor(limit / new_count)

                if current_bw > limit then
                    -- System is over-saturated (Overshoot scenario).
                    -- Apply 50% damping to new connections to reduce aggregate overshoot,
                    -- but keep it high enough for video/streams (unlike FCFS).
                    rate_to_alloc = math.floor(fair_share * 0.5)
                else
                    -- Under or near limit.
                    rate_to_alloc = fair_share
                end
            end

            -- Safety Floor (64KB/s) to prevent timeouts/stalls
            if rate_to_alloc < 65536 then rate_to_alloc = 65536 end
            -- Hard Cap at limit
            if rate_to_alloc > limit then rate_to_alloc = limit end

            -- Update Shared BW Tracker
            local new_bw, err = dict:incr(rate_key, rate_to_alloc)
            if not new_bw then
                dict:set(rate_key, rate_to_alloc)
                new_bw = rate_to_alloc
            end

            -- Apply and store for cleanup
            ngx.ctx.allocated_bw = rate_to_alloc
            ngx.var.calculated_rate = rate_to_alloc
        end
        {% endif %}

        {% if adv_limit_req_rate and adv_limit_req_rate > 0 %}
        local limit_req = require "resty.limit.req"
        local rate = {{ adv_limit_req_rate }}
        local unit = "{{ adv_limit_req_unit }}"
        local burst = {{ adv_limit_req_burst }} or 0

        -- Normalize to requests per second
        if unit == "m" then
            rate = rate / 60
        end

        local lim, err = limit_req.new("ip_req_limit", rate, burst)
        if not lim then
            ngx.log(ngx.ERR, "failed to instantiate a resty.limit.req object: ", err)
            return ngx.exit(500)
        end

        local key = ngx.var.binary_remote_addr
        local delay, err = lim:incoming(key, true)
        if not delay then
            if err == "rejected" then
                return ngx.exit(429)
            end
            ngx.log(ngx.ERR, "failed to limit req: ", err)
            return ngx.exit(500)
        end

        if delay >= 0.001 then
            ngx.sleep(delay)
        end
        {% endif %}


        {% if oidc_enabled %}
		local opts = {
            discovery = "{{ access_list.meta.oidc_discovery_url }}",
            client_id = "{{ access_list.meta.oidc_client_id }}",
            client_secret = "{{ access_list.meta.oidc_client_secret }}",
            redirect_uri = ngx.var.scheme .. "://" .. ngx.var.host .. "/_oauth2_callback",
            scope = "openid profile email",
            session_contents = {id_token=true}
        }
        local res, err = require("resty.openidc").authenticate(opts)
        if err then
            ngx.status = 500
            ngx.say(err)
            ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
        end
        {% endif %}
    }
    {% endif %}
    {% endunless %}

    {% if disable_buffering %}
    proxy_buffering off;
    proxy_request_buffering off;
    {% endif %}

    {% unless anubis_enabled %}
    {% if bandwidth_limit %}
    limit_rate $calculated_rate;
    {% endif %}
    {% endunless %}

    {% unless anubis_enabled %}
    {% if bandwidth_limit %}
    log_by_lua_block {
        local ip = ngx.var.binary_remote_addr
        local dict = ngx.shared.ip_conns

        -- Host-Specific Keys
        local conn_key = "{{ id }}_" .. ip
        local rate_key = "{{ id }}_" .. ip .. "_bw"

        dict:incr(conn_key, -1)

        local allocated = ngx.ctx.allocated_bw
        if allocated then
            local new_val, err = dict:incr(rate_key, -allocated)
            -- Auto-cleanup negative values
            if new_val and new_val < 0 then
                dict:set(rate_key, 0)
            end
        end
    }
    {% endif %}
    {% endunless %}

    {% unless anubis_enabled %}
    {% if access_list_id > 0 %}
      # mTLS Enforcement
      {% if access_list.mtls_enabled %}
        {% if access_list.mtls_use_internal %}
            ssl_client_certificate /data/tls/internal/root_ca.crt;
            ssl_verify_client on;
        {% elsif access_list.mtls_certificate %}
            ssl_client_certificate /data/access/{{ access_list_id }}.crt;
            ssl_verify_client on;
        {% endif %}
      {% endif %}
      {% if auth_type == "authentik_proxy" %}
        # Authentik Configuration
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;

        # Pass original Host/URI
        auth_request_set $authentik_host $http_host;
        auth_request_set $authentik_uri $request_uri;
        auth_request_set $authentik_proto $scheme;
        proxy_set_header X-Authentik-Host $authentik_host;
        proxy_set_header X-Authentik-Uri $authentik_uri;
        proxy_set_header X-Authentik-Proto $authentik_proto;
      {% endif %}

      {% if auth_type == "oauth2_proxy" %}
        {% assign oauth2_prefix = access_list.meta.oauth2_proxy_prefix | default: "/oauth2/" %}
        {% assign oauth2_prefix_no_slash = oauth2_prefix | remove_first: "/" | remove_last: "/" %}
        auth_request     {{ oauth2_prefix }}auth;
        error_page       401 403 = @oauth2_proxy_signin;

        # pass information via X-User and X-Email headers to backend,
        # requires running with --set-xauthrequest flag
        auth_request_set $user   $upstream_http_x_auth_request_user;
        auth_request_set $email  $upstream_http_x_auth_request_email;
        auth_request_set $groups $upstream_http_x_auth_request_groups;
        auth_request_set $preferred_username $upstream_http_x_auth_request_preferred_username;
        proxy_set_header X-User  $user;
        proxy_set_header X-Email $email;
        proxy_set_header X-Groups $groups;
        proxy_set_header X-Preferred-Username $preferred_username;

        # if you enabled --pass-access-token, this will pass the token to the backend
        auth_request_set $token  $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Access-Token $token;

        # if you enabled --cookie-refresh, this is needed for it to work with auth_request
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
      {% endif %}

      {% if access_list.items.length > 0 %}
        # Authorization
        auth_basic            "Authorization required";
        auth_basic_user_file  /data/access/{{ access_list_id }};
        {% if access_list.pass_auth %}
          proxy_set_header Authorization "";
        {% endif %}
      {% endif %}
      # Access Rules: {{ access_list.clients | size }} total
      {% for client in access_list.clients %}
        {{client | nginxAccessRule}}
      {% endfor %}

      # auth_type={{ auth_type }} is_oauth2={{ is_oauth2 }}
      {% unless is_oauth2 %}
        {% if access_list.clients.length > 0 %}
        deny all;
        {% elsif access_list.satisfy_any %}
          {% unless oidc_enabled %}
          deny all;
          {% endunless %}
        {% endif %}
      {% endunless %}
      # Access checks must...
      {% unless is_oauth2 %}
        {% if access_list.satisfy_any %}
          satisfy any;
        {% else %}
          satisfy all;
        {% endif %}
      {% endunless %}
    {% endif %}

    {% if block_exploits or env.DEMO_MODE == "true" %}
      modsecurity on;
      {% if caching_enabled %}
        modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity-crs.conf;
      {% else %}
        modsecurity_rules_file /usr/local/nginx/conf/conf.d/include/modsecurity.conf;
      {% endif %}
    {% endif %}
    {% endunless %}

    {% if maintenance_mode %}
      location / {
        root /html;
        try_files /maintenance.html =503;
        sub_filter '<!-- maintenance_data_injection_point -->' '<div id="m-data" data-end="{{ maintenance_end }}" data-reason="{{ maintenance_reason | escape }}"></div>';
        sub_filter_once on;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
      }
    {% elsif use_default_location %}
      location / {
        {% if forward_scheme == "http" or forward_scheme == "https" %}
          include conf.d/include/proxy-headers.conf;
          {% if forward_query != null and forward_query != "" %}
            set $args "$args&{{ forward_query }}";
            proxy_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$uri$is_args$args{% endif %};
          {% else %}
            proxy_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};
          {% endif %}
        {% elsif forward_scheme == "grpc" or forward_scheme == "grpcs" %}
          include conf.d/include/grpc-headers.conf;
          grpc_pass {{ forward_scheme }}://{{ forward_host }}{% if forward_port != null %}:{{ forward_port }}{% endif %}{% if forward_path != null %}{{ forward_path }}{% else %}$request_uri{% endif %};
        {% elsif forward_scheme == "path" %}
          # root is defined at server level
          {% if index_file != null and index_file != "" %}
            index {{ index_file }};
          {% else %}
            index index.php index.html index.htm;
          {% endif %}
          {% if php_enabled %}
            try_files $uri $uri/ {% if index_dir != null %}/{{ index_dir }}$uri /{{ index_dir }}$uri/ {% endif %}/index.php$is_args$args;
          {% else %}
            try_files $uri $uri/ {% if index_dir != null %}/{{ index_dir }}$uri /{{ index_dir }}$uri/ {% endif %}=404;
          {% endif %}
		{% elsif forward_scheme == "terminal" %}
		  # Terminal: Serve xterm.js SPA
		  root /html/terminal;
		  index index.html;
		  try_files $uri /index.html;
		  add_header Cache-Control "no-store" always;
		  add_header Referrer-Policy "no-referrer" always;
		  add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'sha256-0TM2XkF2pbOlbzZ2guSj/1ZFrpF/3vsggH0WTwyTmA8='; style-src 'self' https://cdn.jsdelivr.net 'sha256-PTA2N09I6l6gKPHKdSWuSn7idtn5qAVhuPdbyUpt6HM='; connect-src 'self' wss:; font-src 'self' data:; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		{% endif %}
	  }
	  {% if forward_scheme == "terminal" %}
	  # A browser first exchanges the authenticated gateway assertion for a 30-second, one-use ticket.
	  location = /terminal-ticket {
		set $terminal_gateway_authorization "";
		limit_except POST { deny all; }
		client_max_body_size 4k;
		access_by_lua_block {
		  local fingerprint = ngx.req.get_headers()["X-ShieldPM-Client-Fingerprint"] or ""
		  if not ngx.re.match(fingerprint, [[^[A-Za-z0-9_-]{43}$]], "jo") then
			return ngx.exit(ngx.HTTP_UNAUTHORIZED)
		  end
		  local timestamp = tostring(ngx.time())
		  local authority = string.lower(ngx.var.http_host or "")
		  local revision = "{{ access_list.revision | default: 1 }}"
		  local payload = table.concat({timestamp, "{{ id }}", authority, fingerprint, revision}, "\n")
		  local signature = ngx.encode_base64(ngx.hmac_sha1("{{ terminal_gateway_secret_plain }}", payload))
		  ngx.req.set_header("X-ShieldPM-Terminal-Timestamp", timestamp)
		  ngx.req.set_header("X-ShieldPM-Terminal-Host-Id", "{{ id }}")
		  ngx.req.set_header("X-ShieldPM-Terminal-Authority", authority)
		  ngx.req.set_header("X-ShieldPM-Terminal-ACL-Revision", revision)
		  ngx.req.set_header("X-ShieldPM-Terminal-Signature", signature)
		  ngx.var.terminal_gateway_authorization = "Bearer " .. signature
		}
		include conf.d/include/proxy-headers.conf;
		proxy_set_header Authorization $terminal_gateway_authorization;
		proxy_set_header Cookie "";
		proxy_pass http://unix:/run/shieldpm.sock:/nginx/proxy-hosts/{{ id }}/terminal/ticket;
		proxy_pass_request_headers on;
		proxy_read_timeout 15s;
		add_header Cache-Control "no-store" always;
		add_header Referrer-Policy "no-referrer" always;
	  }

	  # Terminal WebSocket: HMAC-authenticated gateway plus one-use subprotocol ticket.
	  location = /ws {
		access_by_lua_block {
		  local protocols = ngx.var.http_sec_websocket_protocol or ""
		  local fingerprint = string.match(protocols, "fingerprint%.([A-Za-z0-9_-]+)") or ""
		  if not ngx.re.match(fingerprint, [[^[A-Za-z0-9_-]{43}$]], "jo") then
			return ngx.exit(ngx.HTTP_UNAUTHORIZED)
		  end
		  local timestamp = tostring(ngx.time())
		  local authority = string.lower(ngx.var.http_host or "")
		  local revision = "{{ access_list.revision | default: 1 }}"
		  local payload = table.concat({timestamp, "{{ id }}", authority, fingerprint, revision}, "\n")
		  local signature = ngx.encode_base64(ngx.hmac_sha1("{{ terminal_gateway_secret_plain }}", payload))
		  ngx.req.set_header("X-ShieldPM-Terminal-Timestamp", timestamp)
		  ngx.req.set_header("X-ShieldPM-Terminal-Host-Id", "{{ id }}")
		  ngx.req.set_header("X-ShieldPM-Terminal-Authority", authority)
		  ngx.req.set_header("X-ShieldPM-Terminal-ACL-Revision", revision)
		  ngx.req.set_header("X-ShieldPM-Terminal-Signature", signature)
		}
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		client_max_body_size 64k;
		include conf.d/include/proxy-headers.conf;
        proxy_pass http://unix:/run/shieldpm.sock:/nginx/proxy-hosts/{{ id }}/terminal/ws;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
      }
      {% endif %}
      {% if forward_scheme == "path" and php_enabled %}
      # PHP-FPM Configuration (requires PHP{{ php_version | default: "83" }}=true in ENV)
      location ~ \.php(?:$|/) {
        # root is defined at server level
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php{{ php_version | default: "83" }}.sock;
        fastcgi_index index.php;
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_intercept_errors off;
        {% if php_override_ini %}
        fastcgi_param PHP_VALUE "{{ php_override_ini | replace: '"', '\"' }}";
        {% endif %}
      }
      location ~ /\.ht {
        deny all;
      }
      # Nextcloud .well-known redirects
      location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
      }
      location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
      }
      location = /.well-known/webfinger {
        return 301 $scheme://$host/index.php/.well-known/webfinger;
      }
      location = /.well-known/nodeinfo {
        return 301 $scheme://$host/index.php/.well-known/nodeinfo;
      }
      {% endif %}
    {% endif %}

    # custom locations
    {% unless maintenance_mode %}
    {{ locations }}
    {% endunless %}

    {% unless anubis_enabled %}
    {% if access_list_id > 0 and auth_type == "authentik_proxy" %}
    location /outpost.goauthentik.io {
        proxy_pass              {{ access_list.meta.authentik_host }}/outpost.goauthentik.io;
        proxy_set_header        Host $host;
        proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
        add_header              Set-Cookie $auth_cookie;
        auth_request_set        $auth_cookie $upstream_http_set_cookie;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$request_uri;
    }
    {% endif %}

    {% if access_list_id > 0 and auth_type == "oauth2_proxy" %}
    {% assign oauth2_prefix = access_list.meta.oauth2_proxy_prefix | default: "/oauth2/" %}
    location {{ oauth2_prefix }} {
        auth_request off;
        proxy_pass       http://unix:/run/shieldpm/oauth2-proxy-{{ access_list_id }}.sock;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Scheme                $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = {{ oauth2_prefix }}auth {
        auth_request off;
        proxy_pass http://unix:/run/shieldpm/oauth2-proxy-{{ access_list_id }}.sock:{{ oauth2_prefix }}auth;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        proxy_set_header X-Scheme         $scheme;
        # nginx auth_request includes headers but not body
        proxy_set_header Content-Length   "";
        proxy_pass_request_body           off;
    }

    location @oauth2_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 {{ oauth2_prefix }}start?rd=$request_uri;
    }
    {% endif %}
    {% endunless %}

    # Custom
    {% unless maintenance_mode %}
    include /data/custom_nginx/server_proxy.conf;
    {% endunless %}

    {% if maintenance_on_failure %}
    proxy_intercept_errors on;
    error_page 502 504 @maintenance_fallback;
    {% endif %}

    location @maintenance_fallback {
        root /html;
        try_files /maintenance.html =502;
        internal;
    }

    {{ advanced_config }}
