{% if cache and cache_ttl_seconds %}
proxy_cache {{ cache.name }};
proxy_cache_methods GET HEAD;
proxy_cache_convert_head on;
proxy_cache_key "{{ cache.namespace }}|$scheme|GET|$host|{% if cache.cache_key == 'uri_ignore_query' %}$uri{% else %}$request_uri{% endif %}";
proxy_cache_valid 200 {{ cache_ttl_seconds }}s;
proxy_cache_lock on;
proxy_cache_bypass $spm_cache_method_{{ id }} $spm_cache_asset_{{ id }} $http_authorization $http_cookie $http_upgrade{% if cache.protected %} 1{% endif %};
proxy_no_cache $spm_cache_method_{{ id }} $spm_cache_asset_{{ id }} $http_authorization $http_cookie $http_upgrade $upstream_http_set_cookie{% if cache.protected %} 1{% endif %};
more_set_headers "X-ShieldPM-Cache: $upstream_cache_status";
{% else %}
{% if cache %}proxy_cache off;{% endif %}
{% endif %}
