# --------------------------------------------------------------------------
# {{ incoming_port }} TCP: {{ tcp_forwarding }} UDP: {{ udp_forwarding }}
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
#
# Stream listeners bind where clients connect, so the public bind is explicit.
# Set STREAM_LISTEN_LOCALHOST=true to keep every stream listener on loopback
# (for example when a separate load balancer terminates public traffic).
# Incoming-port collisions are rejected by internal/stream.js before a write.
# --------------------------------------------------------------------------

{% assign stream_ipv4 = env.IPV4_BINDING %}
{% assign stream_ipv6_enabled = env.DISABLE_IPV6 == "false" %}
{% if env.STREAM_LISTEN_LOCALHOST == "true" %}
  {% assign stream_ipv4 = "127.0.0.1" %}
  {% assign stream_ipv6_enabled = false %}
{% endif %}

{% if enabled %}
  {% if tcp_forwarding %}
    server {
      listen {{ stream_ipv4 }}:{{ incoming_port }}{% if certificate and certificate_id > 0 %} ssl{% endif %} deferred so_keepalive=on;
      {% if stream_ipv6_enabled %}listen {{ env.IPV6_BINDING }}:{{ incoming_port }}{% if certificate and certificate_id > 0 %} ssl{% endif %} deferred so_keepalive=on;{% endif %}

      {% if proxy_protocol_forwarding %}
        proxy_protocol on;
      {% endif %}


      {% if certificate and certificate_id > 0 %}
        {% if certificate.provider == "letsencrypt" %}
          # Certbot TLS
          ssl_certificate /data/tls/certbot/live/npm-{{ certificate_id }}/fullchain.pem;
          ssl_certificate_key /data/tls/certbot/live/npm-{{ certificate_id }}/privkey.pem;
          {% if env.ACME_OCSP_STAPLING == "true" %}
            ssl_stapling on;
            ssl_stapling_verify on;
            ssl_stapling_file /data/tls/certbot/live/npm-{{ certificate_id }}.der;
          {% endif %}
        {% elsif certificate.provider == "internal" %}
          # Internal CA TLS
          ssl_certificate /data/tls/internal/npm-{{ certificate_id }}/fullchain.pem;
          ssl_certificate_key /data/tls/internal/npm-{{ certificate_id }}/privkey.pem;
        {% else %}
          # Custom TLS
          ssl_certificate /data/tls/custom/npm-{{ certificate_id }}/fullchain.pem;
          ssl_certificate_key /data/tls/custom/npm-{{ certificate_id }}/privkey.pem;
          {% if env.CUSTOM_OCSP_STAPLING == "true" %}
            ssl_stapling on;
            ssl_stapling_verify on;
            ssl_stapling_file /data/tls/custom/npm-{{ certificate_id }}.der;
          {% endif %}
        {% endif %}
      {% endif %}

      proxy_pass {{ forwarding_host | nginxUpstreamHost }}{% if forwarding_port != null and forwarding_port != "" %}:{{ forwarding_port }}{% endif %};

      # Custom
      include /data/custom_nginx/server_stream.conf;
      include /data/custom_nginx/server_stream_tcp.conf;
    }
  {% endif %}

  {% if udp_forwarding %}
    server {
      listen {{ stream_ipv4 }}:{{ incoming_port }} udp reuseport;
      {% if stream_ipv6_enabled %}listen {{ env.IPV6_BINDING }}:{{ incoming_port }} udp reuseport;{% endif %}

      {% if proxy_protocol_forwarding %}
        proxy_protocol on;
      {% endif %}

      proxy_pass {{ forwarding_host | nginxUpstreamHost }}{% if forwarding_port != null and forwarding_port != "" %}:{{ forwarding_port }}{% endif %};

      # Custom
      include /data/custom_nginx/server_stream.conf;
      include /data/custom_nginx/server_stream_udp.conf;
    }
  {% endif %}
{% endif %}
