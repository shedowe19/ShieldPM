{% if firewall %}
# Host-specific IP firewall. All directives contain validated CIDRs or numeric rule identifiers.
geo $spm_fw_{{ firewall.id }}_allow {
    default 0;
    {% for rule in firewall.allow_rules %}{{ rule.address }} {{ rule.value }};
    {% endfor %}
}
geo $spm_fw_{{ firewall.id }}_manual {
    default 0;
    {% for rule in firewall.manual_rules %}{{ rule.address }} {{ rule.value }};
    {% endfor %}
}
geo $spm_fw_{{ firewall.id }}_list {
    default 0;
    {% for rule in firewall.list_rules %}{{ rule.address }} {{ rule.value }};
    {% endfor %}
}
{% if firewall.has_country_rules %}
# Reuse the existing Analytics lookup; unsupported/empty database codes are unknown.
map $geoip2_country_code $spm_fw_{{ firewall.id }}_country {
    default XX;
    {% for code in firewall.known_country_codes %}{{ code }} {{ code }};
    {% endfor %}
}
map $spm_fw_{{ firewall.id }}_country $spm_fw_{{ firewall.id }}_country_rule {
    default 0;
    {% for rule in firewall.country_rules %}{{ rule.code }} {{ rule.value }};
    {% endfor %}
}
map $spm_fw_{{ firewall.id }}_list $spm_fw_{{ firewall.id }}_list_or_country {
    default $spm_fw_{{ firewall.id }}_list;
    0 $spm_fw_{{ firewall.id }}_country_rule;
}
{% endif %}
map $spm_fw_{{ firewall.id }}_manual $spm_fw_{{ firewall.id }}_hit {
    default $spm_fw_{{ firewall.id }}_manual;
    {% if firewall.has_country_rules %}0 $spm_fw_{{ firewall.id }}_list_or_country;
    {% else %}
    0 $spm_fw_{{ firewall.id }}_list;
    {% endif %}
}
map $uri $spm_fw_{{ firewall.id }}_acme {
    default 0;
    ~^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ 1;
}
map "$spm_fw_{{ firewall.id }}_allow:$spm_fw_{{ firewall.id }}_hit:$spm_fw_{{ firewall.id }}_acme" $spm_fw_{{ firewall.id }}_blocked {
    default 0;
    ~^0:[1-9][0-9]*:0$ 1;
}
log_format spm_fw_{{ firewall.id }} escape=json '{"time":"$time_iso8601","host_id":{{ firewall.id }},"host":"$host","ip":"$remote_addr","request_id":"$request_id","rule_id":"$spm_fw_{{ firewall.id }}_hit","reason":"$spm_fw_{{ firewall.id }}_reason","source":"$spm_fw_{{ firewall.id }}_source"{% if firewall.has_country_rules %},"country_code":"$spm_fw_{{ firewall.id }}_country"{% endif %},"status":$status}';
{% endif %}
