{% if pool %}
proxy_connect_timeout {{ pool.connect_timeout }}s;
{% unless upload_transport %}proxy_read_timeout {{ pool.read_timeout }}s;{% endunless %}
# Never add non_idempotent: Nginx must not replay POST/PATCH/LOCK after dispatch.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries {{ pool.targets | size }};
proxy_next_upstream_timeout {{ pool.read_timeout }}s;
{% if forward_scheme == "https" %}
proxy_ssl_server_name on;
proxy_ssl_name {% if pool.tls_server_name %}"{{ pool.tls_server_name }}"{% elsif pool.host_header %}"{{ pool.host_header }}"{% else %}$host{% endif %};
proxy_ssl_verify {% if pool.tls_verify %}on{% else %}off{% endif %};
{% if pool.tls_verify %}proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;{% endif %}
{% endif %}
{% endif %}
