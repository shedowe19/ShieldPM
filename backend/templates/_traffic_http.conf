{% if pool %}
map $http_upgrade $spm_pool_connection_{{ id }} { default upgrade; "" ""; }
{% endif %}
{% if pool or cache %}
log_format spm_traffic_{{ id }} escape=json '{"time":"$time_iso8601","upstream":"$upstream_addr","cache":"$upstream_cache_status","status":$status}';
{% endif %}
{% if cache %}
proxy_cache_path {{ cache.directory }} levels=1:2 keys_zone={{ cache.name }}:1m max_size={{ cache.max_size_mb }}m inactive={{ cache.inactive_seconds }}s use_temp_path=off;
map $request_method $spm_cache_method_{{ id }} { default 1; GET 0; HEAD 0; }
map $uri $spm_cache_asset_{{ id }} { default {% if cache.assets_only %}1{% else %}0{% endif %}; ~*\.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf)$ 0; }
{% endif %}
