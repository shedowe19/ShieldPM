services:
  shieldpm:
    image: ghcr.io/shedowe19/shieldpm:latest
    container_name: shieldpm
    restart: always
    network_mode: host
    # --------------------------------------------------------------------------
    # VOLUMES
    # --------------------------------------------------------------------------
    volumes:
      - "/opt/shieldpm:/data"
      # - "/var/www:/var/www" # Optional: Webserver root
      # - "/path/to/old/npm/letsencrypt:/etc/letsencrypt" # Migration only
    
    # --------------------------------------------------------------------------
    # ENVIRONMENT VARIABLES
    # --------------------------------------------------------------------------
    environment:
      # --- System Settings ---
      - "TZ=Europe/Berlin"
      - "PUID=0"
      - "PGID=0"
      
      # --- Network & Ports ---
      - "NPM_PORT=81"      # Web UI Port
      - "HTTP_PORT=80"     # HTTP Ingress
      - "HTTPS_PORT=443"   # HTTPS Ingress
      - "HTTP3_ALT_SVC_PORT=443"
      # - "IPV4_BINDING=127.0.0.1"
      # - "IPV6_BINDING=[::1]"
      # - "DISABLE_IPV6=false"

      # --- Database Connection (SQLite by default) ---
      # For MySQL/Postgres, uncomment related blocks below
      # - "DB_MYSQL_HOST=127.0.0.1"
      # - "DB_MYSQL_PORT=3306"
      # - "DB_MYSQL_USER=npm"
      # - "DB_MYSQL_PASSWORD=npm"
      # - "DB_MYSQL_NAME=npm"

      # --- ACME & SSL ---
      # - "ACME_EMAIL=your@email.com" # Recommended for internal alerts
      # - "ACME_SERVER=https://acme-v02.api.letsencrypt.org/directory"
      # - "ACME_OCSP_STAPLING=true"

      # --- Analytics & Logging ---
      # - "LOGROTATE=true"
      # - "LOGROTATIONS=7"
      # - "GOA=false" # GoAccess Analytics

      # --- PHP Options (Not Recommended, use dedicated container) ---
      # - "PHP82=false"
      # - "PHP83=false"

      # --- Advanced Nginx ---
      # - "NGINX_QUIC_BPF=true" # Requires CAP_ADD
      # - "NGINX_DISABLE_PROXY_BUFFERING=true"
      # - "DISABLE_HTTP=false"

    # --------------------------------------------------------------------------
    # CAPABILITIES (Advanced)
    # --------------------------------------------------------------------------
    # cap_add:
    #   - BPF
    #   - NET_ADMIN

# ==============================================================================
# OPTIONAL SERVICES
# Uncomment the blocks below to enable additional features
# ==============================================================================

