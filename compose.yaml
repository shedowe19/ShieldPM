# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ShieldPM — Docker Compose (Full Configuration)                              ║
# ║                                                                              ║
# ║  Quick Start:                                                                ║
# ║   1. Set your timezone (TZ) below                                            ║
# ║   2. Uncomment features you need (remove the leading '#')                    ║
# ║   3. docker compose up -d                                                    ║
# ║                                                                              ║
# ║  For a simpler setup, see compose.easy.yaml                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │  SHIELDPM — Main Application                                             │
  # └──────────────────────────────────────────────────────────────────────────┘
  shieldpm:
    image: ghcr.io/shedowe19/shieldpm:develop
    container_name: shieldpm
    restart: always
    network_mode: host

    volumes:
      - "/opt/shieldpm:/data"
      # - "/var/www:/var/www"                     # Mount for custom HTML/PHP sites
      # - "shm-volume:/dev/shm/check-point"       # Required for OpenAppSec (enable volume below + ipc: host)

    environment:

      # ── System ─────────────────────────────────────────────────────────────
      - "TZ=Europe/Berlin" # REQUIRED — https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - "TRUST_PROXY=1" # REQUIRED for the image's single internal Nginx -> Express proxy hop
      # - "PUID=0"                                 # User ID (≥99 or 0), default: 0
      # - "PGID=0"                                 # Group ID (≥99 or 0), default: 0
      # - "CSRF_SECRET=your-secure-random-secret"  # Min 32 chars. Generate: openssl rand -hex 32

      # ── Ports & Network ────────────────────────────────────────────────────
      # - "NPM_PORT=81"                            # UI port, default: 81
      # - "GOA_PORT=91"                            # GoAccess port, default: 91
      # - "HTTP_PORT=80"                           # HTTP port, default: 80
      # - "HTTPS_PORT=443"                         # HTTPS port (TCP+UDP), default: 443
      # - "HTTP3_ALT_SVC_PORT=443"                 # Alt-Svc port for HTTP/3, default: 443
      # - "DISABLE_HTTP=false"                     # Stop listening on port 80
      # - "DISABLE_H3_QUIC=false"                  # Fully disable HTTP/3 + QUIC
      # - "LISTEN_PROXY_PROTOCOL=false"            # Use PROXY protocol (disables H3)

      # ── Bind Addresses ─────────────────────────────────────────────────────
      # - "IPV4_BINDING=127.0.0.1"                 # IPv4 bind for all hosts
      # - "NPM_IPV4_BINDING=127.0.0.1"             # IPv4 bind for UI only
      # - "GOA_IPV4_BINDING=127.0.0.1"             # IPv4 bind for GoAccess only
      # - "IPV6_BINDING=[::1]"                     # IPv6 bind for all hosts
      # - "NPM_IPV6_BINDING=[::1]"                 # IPv6 bind for UI only
      # - "GOA_IPV6_BINDING=[::1]"                 # IPv6 bind for GoAccess only
      # - "DISABLE_IPV6=true"                      # Fully disable IPv6
      # - "NPM_LISTEN_LOCALHOST=true"              # Bind UI to localhost only
      # - "GOA_LISTEN_LOCALHOST=true"              # Bind GoAccess to localhost only

      # ── Database (SQLite by default) ───────────────────────────────────────
      #
      # MySQL / MariaDB:
      # - "DB_MYSQL_HOST=127.0.0.1"
      # - "DB_MYSQL_PORT=3306"
      # - "DB_MYSQL_USER=npm"
      # - "DB_MYSQL_PASSWORD=npm"
      # - "DB_MYSQL_NAME=npm"
      # - "DB_MYSQL_SSL=false"
      # - "DB_MYSQL_SSL_REJECT_UNAUTHORIZED=true"
      # - "DB_MYSQL_SSL_VERIFY_IDENTITY=true"
      #
      # PostgreSQL:
      # - "DB_POSTGRES_HOST=127.0.0.1"
      # - "DB_POSTGRES_PORT=5432"
      # - "DB_POSTGRES_USER=npm"
      # - "DB_POSTGRES_PASSWORD=npm"
      # - "DB_POSTGRES_NAME=npm"

      # ── SSL & ACME ────────────────────────────────────────────────────────
      # - "ACME_EMAIL=your-email"                  # Recommended (required for ZeroSSL/Google)
      # - "ACME_SERVER=https://acme-v02.api.letsencrypt.org/directory"
      # - "ACME_EAB_KID=123456789abcdef"           # External Account Binding key
      # - "ACME_EAB_HMAC_KEY=123456789abcdef"      # External Account Binding HMAC
      # - "ACME_MUST_STAPLE=true"                  # Enable must-staple extension
      # - "ACME_OCSP_STAPLING=true"                # Enable OCSP stapling
      # - "ACME_PROFILE=shortlived"                # ACME profile, default: none
      # - "ACME_KEY_TYPE=rsa"                      # Key type: ecdsa (default) or rsa
      # - "ACME_SERVER_TLS_VERIFY=false"           # Verify ACME server TLS cert
      # - "DEFAULT_CERT_ID=1"                      # Use cert ID instead of dummy certs
      # - "CUSTOM_OCSP_STAPLING=true"              # OCSP stapling for custom certs
      # - "CRT=72"                                 # Hours between cert renewal checks, default: 23

      # ── Logging & Analytics ────────────────────────────────────────────────
      # - "LOGROTATE=true"                         # Enable access logs + daily rotation
      # - "LOGROTATIONS=7"                         # Keep N rotated logs, default: 3
      # - "NGINX_LOG_NOT_FOUND=true"               # Log 404s to docker logs
      # - "GOA=true"                               # Enable GoAccess (implies LOGROTATE=true)
      # - "GOACLA=--agent-list --real-os --double-decode --anonymize-ip --anonymize-level=2 --keep-last=7 --with-output-resolver --no-query-string"

      # ── PHP ────────────────────────────────────────────────────────────────
      # - "PHP82=true"
      # - "PHP82_APKS=php8.2-curl php8.2-openssl"
      # - "PHP83=true"
      # - "PHP83_APKS=php8.3-curl php8.3-openssl"
      # - "PHP84=true"
      # - "PHP84_APKS=php8.4-curl php8.4-openssl"

      # ── Advanced Nginx ─────────────────────────────────────────────────────
      # - "NGINX_QUIC_BPF=true"                    # Requires cap_add: BPF, PERFMON, NET_ADMIN
      # - "NGINX_DISABLE_PROXY_BUFFERING=true"     # Disable proxy buffering globally
      # - "NGINX_404_REDIRECT=true"                # Redirect 404 → /
      # - "NGINX_HSTS_SUBDOMAINS=false"            # HSTS for subdomains, default: true
      # - "X_FRAME_OPTIONS=deny"                   # deny | sameorigin | none
      # - "NGINX_WORKER_PROCESSES=8"               # default: auto
      # - "NGINX_WORKER_CONNECTIONS=1024"           # default: 512
      # - "DISABLE_NGINX_BEAUTIFIER=true"          # Skip config beautification
      # - "FULLCLEAN=true"                         # Remove unused config folders
      # - "SKIP_IP_RANGES=false"                   # Skip Cloudflare IP range fetch, default: true
      # - "IPRT=3"                                 # Hours between IP range updates, default: 1

      # ── Nginx Modules ─────────────────────────────────────────────────────
      # - "NGINX_LOAD_OPENAPPSEC_ATTACHMENT_MODULE=true"       # OpenAppSec WAF (requires ipc: host + shm-volume)
      # - "NGINX_LOAD_GEOIP2_MODULE=true"                     # GeoIP2 module
      # - "NGINX_LOAD_NJS_MODULE=true"                         # njs (JavaScript) module
      # - "NGINX_LOAD_NTLM_MODULE=true"                        # NTLM auth module
      # - "NGINX_LOAD_VHOST_TRAFFIC_STATUS_MODULE=true"        # VHost traffic stats

      # ── Docker Discovery ───────────────────────────────────────────────────
      # - "DOCKER_HOSTS=tcp://10.10.10.1:2375,tcp://10.10.10.2:2375"  # Additional remote Docker hosts

      # ── Initialization (first start only) ──────────────────────────────────
      # One-time Nextcloud AIO bootstrap after the ownership claim; prefer a mounted secret file.
      # - "SHIELDPM_AIO_ACCESS_TOKEN_FILE=/run/secrets/shieldpm-aio-access-token"
      # - "INITIAL_DEFAULT_PAGE=444"
      # - "ENABLE_PRERUN=true"

      # ── Tor Onion Services ─────────────────────────────────────────────────
      # - "TOR_ENABLED=true"                       # default: true

      # ── WireGuard Tunnel ───────────────────────────────────────────────────
      # Settings (endpoint, subnet, port) are configured in the ShieldPM UI.
      # To enable, uncomment cap_add, sysctls and devices below.

    # ── Capabilities ───────────────────────────────────────────────────────
    # Uncomment for QUIC BPF and/or WireGuard Tunnels:
    # cap_add:
    #   - BPF                                      # QUIC BPF
    #   - PERFMON                                  # QUIC BPF
    #   - NET_ADMIN                                # WireGuard + QUIC BPF
    #   - NET_RAW                                  # WireGuard

    # ── Kernel Parameters ──────────────────────────────────────────────────
    # Uncomment for WireGuard Tunnel routing:
    # sysctls:
    #   net.ipv4.ip_forward: 1
    #   net.ipv4.conf.all.src_valid_mark: 1

    # ── Devices ────────────────────────────────────────────────────────────
    # Uncomment for WireGuard TUN interface:
    # devices:
    #   - /dev/net/tun:/dev/net/tun

    # ── DNS Override ───────────────────────────────────────────────────────
    # dns:
    #   - 1.1.1.1
    #   - 1.0.0.1

    # ── IPC ────────────────────────────────────────────────────────────────
    # ipc: host                                    # Required for OpenAppSec


  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │  OPTIONAL SERVICES — Uncomment entire blocks to enable                   │
  # └──────────────────────────────────────────────────────────────────────────┘


