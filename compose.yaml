# ==============================================================================
# ShieldPM - Advanced Docker Compose Configuration
# ------------------------------------------------------------------------------
# HOW TO USE THIS FILE:
# 1. This is the "Full Configuration" with all features available.
#    For a simpler start, check 'compose.easy.yaml' first.
#
# 2. REQUIRED SETTINGS:
#    - TZ (Timezone)
#
# 3. OPTIONAL SETTINGS:
#    - Uncomment the environment variables you need (remove the leading '# -').
#    - For Database (MySQL/Postgres), CrowdSec, or OpenAppSec, scroll to the
#      bottom "OPTIONAL SERVICES" section and uncomment the desired blocks.
# ==============================================================================
services:
  shieldpm:
    image: ghcr.io/shedowe19/shieldpm:develop
    container_name: shieldpm
    restart: always
    network_mode: host
    
    # --------------------------------------------------------------------------
    # VOLUMES
    # --------------------------------------------------------------------------
    volumes:
      - "/opt/shieldpm:/data"
      # - "/var/www:/var/www" # optional, if you want to use ShieldPM directly as a webserver for html/php
      # - "/path/to/old/npm/letsencrypt/folder:/etc/letsencrypt" # Only needed for initial migration from original nginx-proxy-manager to this fork, remove after migration
      # - "shm-volume:/dev/shm/check-point" # required if you want to use the openappsec attachment module, also enable this volume at the end of this compose.yaml and set ipc: host

    # --------------------------------------------------------------------------
    # ENVIRONMENT VARIABLES
    # --------------------------------------------------------------------------
    environment:
      # --- System Settings ---
      - "TZ=Europe/Berlin" # set timezone, required, set it to one of the values from the "TZ identifier" https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
      # - "PUID=0" # set user id, needs to be a number greater or equal to 99, or equal to 0, default 0 (root)
      # - "PGID=0" # set group id, needs to be a number greater or equal to 99, or equal to 0, default 0 (root), requires non-zero PUID
      # - "CSRF_SECRET=your-secure-random-secret" # Secret for CSRF token generation. Change this in production!
      
      # --- Network & Ports ---
      # - "NPM_PORT=81" # Port the ShieldPM UI should be bound to, default 81, change this if you want to run multiple shieldpm instances in network mode host
      # - "GOA_PORT=91" # Port for goaccess, default 91, change this if you want to run multiple shieldpm with goaccess instances in network mode host
      # - "HTTP_PORT=80" # tcp port to use for http traffic, changing this may break certbot http challenge, default 80
      # - "HTTPS_PORT=443" # udp and tcp port to use for https traffic, changing this may break certbot http challenge, default 443
      # - "HTTP3_ALT_SVC_PORT=443" # please change this if the udp port the clients connect to is not 443, default 443
      # - "DISABLE_HTTP=false" # prevents nginx from listening on port 80, default false
      # - "LISTEN_PROXY_PROTOCOL=false" # should listeners of http(s) hosts (proxy/redirect/dead and default) use proxy protocol instead of http(s)? default false, overrides DISABLE_H3_QUIC to true
      # - "DISABLE_H3_QUIC=false" # prevents nginx from listening on port 443 udp for default host and all your hosts, this will fully disable HTTP/3 and QUIC, even if you enable it inside the UI, not recommended, default false
      
      # - "IPV4_BINDING=127.0.0.1" # IPv4 address to bind, defaults to all
      # - "NPM_IPV4_BINDING=127.0.0.1" # IPv4 address to bind for the ShieldPM UI, defaults to all
      # - "GOA_IPV4_BINDING=127.0.0.1" # IPv4 address to bind for goaccess, defaults to all
      # - "IPV6_BINDING=[::1]" # IPv6 address to bind, defaults to all
      # - "NPM_IPV6_BINDING=[::1]" # IPv6 address to bind for the ShieldPM UI, defaults to all
      # - "GOA_IPV6_BINDING=[::1]" # IPv6 address to bind for goaccess, defaults to all
      # - "DISABLE_IPV6=true" # fully disables listening on IPv6 and the IPv6 resolver of nginx, overrides IPV6_BINDING/NPM_IPV6_BINDING/GOA_IPV6_BINDING, default false
      # - "NPM_LISTEN_LOCALHOST=true" # Binds the ShieldPM UI only to localhost (IPv4+IPv6), overrides NPM_IPV4_BINDING/NPM_IPV6_BINDING, default false
      # - "GOA_LISTEN_LOCALHOST=true" # Binds goaccess only to localhost (IPv4+IPv6), overrides GOA_IPV4_BINDING/GOA_IPV6_BINDING, default false

      # --- Database Connection (SQLite by default) ---
      # - "DB_MYSQL_HOST=127.0.0.1" # MySQL/MariaDB Host
      # - "DB_MYSQL_PORT=3306" # MySQL/MariaDB Port
      # - "DB_MYSQL_USER=npm" # MySQL/MariaDB User
      # - "DB_MYSQL_PASSWORD=npm" # MySQL/MariaDB Password
      # - "DB_MYSQL_NAME=npm" # MySQL/MariaDB Database Name
      # - "DB_MYSQL_SSL=false" # Enable SSL for MySQL/MariaDB? default false
      # - "DB_MYSQL_SSL_REJECT_UNAUTHORIZED=true" # Reject unauthorized SSL certificates? default true
      # - "DB_MYSQL_SSL_VERIFY_IDENTITY=true" # Verify SSL certificate identity? default true
      
      # - "DB_POSTGRES_HOST=127.0.0.1" # Postgres Host
      # - "DB_POSTGRES_PORT=5432" # Postgres Port
      # - "DB_POSTGRES_USER=npm" # Postgres User
      # - "DB_POSTGRES_PASSWORD=npm" # Postgres Password
      # - "DB_POSTGRES_NAME=npm" # Postgres Database Name

      # --- ACME & SSL ---
      # - "ACME_EMAIL=your-email" # email address to use for acme, currently optional, may be required in the future, so I recommend entering your email here, optional for letsencrypt, but required for zerossl and google public ca
      # - "ACME_SERVER=https://acme-v02.api.letsencrypt.org/directory" # acme server used when requesting/renewing certs using certbot
      # - "ACME_EAB_KID=123456789abcdef" # Key Identifier for External Account Binding for the acme server
      # - "ACME_EAB_HMAC_KEY=123456789abcdef" # HMAC key for External Account Binding for the acme server
      # - "ACME_MUST_STAPLE=true" # enables must-staple, default false, I recommend enabling this if your CA supports it
      # - "ACME_OCSP_STAPLING=true" # enables ocsp stapling, default false, I recommend enabling this if your CA supports it
      # - "ACME_PROFILE=shortlived" # sets the profile to be used from the acme server, defaults to "none"
      # - "ACME_KEY_TYPE=rsa" # which key type to use ecdsa or rsa, default and recommended: ecdsa
      # - "ACME_SERVER_TLS_VERIFY=false" # enables checking if ACME_SERVER has a valid TLS cert, default and recommended true
      
      # - "DEFAULT_CERT_ID=1" # ID of cert to use instead of dummycerts, default 0/unset/dummycerts
      # - "CUSTOM_OCSP_STAPLING=true" # enables ocsp stapling for custom certs, default false, I recommend enabling this if your custom certs support it
      # - "CRT=72" # Set how many hours should be between certbot trying to renew your certs, default 23

      # --- Analytics & Logging ---
      # - "LOGROTATE=true" # Enables writing http access logs to /opt/shieldpm/nginx/access.log, stream access logs to /opt/shieldpm/nginx/stream.log and enables daily logrotation, default false
      # - "LOGROTATIONS=7" # Set how often the access.log should be rotated until it is deleted, default 3
      # - "NGINX_LOG_NOT_FOUND=true" # Log 404 errors to the docker logs, unrelated to access logs, default false
      # - "GOA=true" # Enables goaccess (and overrides LOGROTATE to true), default false --- if you download the GeoLite2-Country.mmdb...
      # - "GOACLA=--agent-list --real-os --double-decode --anonymize-ip --anonymize-level=2 --keep-last=7 --with-output-resolver --no-query-string" # Arguments that should be passed to goaccess

      # --- PHP Options ---
      # - "PHP82=true" # Activate PHP82, default false
      # - "PHP82_APKS=php82-curl php82-openssl" # Add php extensions
      # - "PHP83=true" # Activate PHP83, default false
      # - "PHP83_APKS=php83-curl php83-openssl"
      # - "PHP84=true" # Activate PHP84, default false
      # - "PHP84_APKS=php84-curl php84-openssl"

      # --- Advanced Nginx ---
      # - "NGINX_QUIC_BPF=true" # enables nginx's quic_bpf. Requires CAP_ADD (BPF, PERFMON, NET_ADMIN)
      # - "NGINX_DISABLE_PROXY_BUFFERING=true" # Disables the proxy_buffering/proxy_request_buffering options of nginx by default for all hosts, default false
      # - "NGINX_404_REDIRECT=true" # Redirect to / instead of showing a 404 error page, default false
      # - "NGINX_HSTS_SUBDOMAINS=false" # when enabling security headers, also enable hsts for subdomains, recommended, default true
      # - "X_FRAME_OPTIONS=deny" # value to use for the X-Frame-Options header when enabling security headers, valid is "deny", "sameorigin" and "none" (means unset)
      # - "NGINX_WORKER_PROCESSES=8" # value of worker_processes, default and recommended: auto
      # - "NGINX_WORKER_CONNECTIONS=1024" # value of worker_connections, default: 512
      # - "DISABLE_NGINX_BEAUTIFIER=true" # disables nginxbeautifier
      # - "FULLCLEAN=true" # Cleans unused config folders, default false
      # - "SKIP_IP_RANGES=false" # Skip fetching/whitelisting ip ranges from cloudflare, default true
      # - "IPRT=3" # Set how many hours should be between updating ip ranges from aws and cloudflare, default 1, ignored when SKIP_IP_RANGES is true

      # --- OpenAppSec ---
      # - "NGINX_LOAD_OPENAPPSEC_ATTACHMENT_MODULE=true" # loads the openappsec attachment module, you must also set ipc and enable the shm-volume
      # - "NGINX_LOAD_GEOIP2_MODULE=true" # loads the geoip2 module, requires manual configuration, default false
      # - "NGINX_LOAD_NJS_MODULE=true" # loads the njs module (nginx JavaScript module), requires manual configuration, default false
      # - "NGINX_LOAD_NTLM_MODULE=true" # loads the ntlm module, requires manual configuration, default false
      # - "NGINX_LOAD_VHOST_TRAFFIC_STATUS_MODULE=true" # loads the virtual host traffic status module, requires manual configuration, default false
      # - "DOCKER_HOSTS=tcp://10.10.10.1:2375,tcp://10.10.10.2:2375" # Optional: Connect to additional remote Docker hosts (local socket is always monitored)
      
      # --- Initialization ---
      # - "INITIAL_ADMIN_EMAIL=<initial@email.tld>" # email to use instead of admin@example.org on first start
      # - "INITIAL_ADMIN_PASSWORD=<initial-password>" # password to use instead of a random password
      # - "INITIAL_DEFAULT_PAGE=444" # default page to set on first start
      # - "ENABLE_PRERUN=true" # see readme, default off

      # --- Tor Onion Services ---
      # - "TOR_ENABLED=true" # Enable/disable Tor daemon for Onion Services, default true

    # --------------------------------------------------------------------------
    # CAPABILITIES (Advanced)
    # --------------------------------------------------------------------------
    # cap_add: # required if you set NGINX_QUIC_BPF to true
    #   - BPF 
    #   - PERFMON
    #   - NET_ADMIN
    
    # dns: # only set this if you need/want to override the default DNS server
    #   - 1.1.1.1 # Cloudflare
    #   - 1.0.0.1 # Cloudflare

    # ipc: host # required when you want to use the openappsec attachment module

