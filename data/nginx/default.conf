# ----------------------------------------------------------------------
# Default Site
# DO NOT EDIT THIS FILE DIRECTLY, CHANGES WILL BE LOST WHEN UPDATING!
# ----------------------------------------------------------------------

server {


  listen : ssl;




  server_name "";
  ssl_reject_handshake on;
  return 444;
}

server {


  listen : ssl reuseport deferred so_keepalive=on default_server;




  server_name _;
  location /.well-known/acme-challenge/ { root /data/acme-challenge; }


    ssl_certificate ;
    ssl_certificate_key ;
    #ssl_stapling on;
    #ssl_stapling_verify on;
    #ssl_stapling_file ;
    if ($scheme = "http") {
      return 308 https://$host$is_request_port$request_port$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
      return 308 https://$host$is_request_port$request_port$request_uri;
    }









}
