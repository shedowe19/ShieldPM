name: Build Docker Image

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - global/certbot-dns-plugins.json
      - frontend/**
      - backend/**
      - rootfs/**
      - nginx-quic/**

    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - global/certbot-dns-plugins.json
      - frontend/**
      - backend/**
      - rootfs/**
      - nginx-quic/**

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/shedowe19/shieldpm

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------
  # PHASE 1: PREPARATION (Calculate Version & Base Tag)
  # ---------------------------------------------------------
  prepare:
    name: "⚙️ Prepare & Version"
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    outputs:
      version_hash: ${{ steps.calc.outputs.hash }}
      docker_tag_base: ${{ steps.calc.outputs.tag_base }}
      is_pr: ${{ steps.calc.outputs.is_pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Calculate Version & Tags"
        id: calc
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "hash=${SHORT_SHA}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CLEAN_PR=$(echo pr-${{ github.ref_name }} | sed "s|refs/pull/:||g" | sed "s|/merge||g")
            echo "tag_base=${CLEAN_PR}" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "tag_base=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------
  # PHASE 2: BUILD (Matrix for x86 and ARM + LXC Export)
  # ---------------------------------------------------------
  build:
    name: "🏗️ Build ${{ matrix.arch }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            flags: "FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            flags: "FLAGS=-mbranch-protection=standard"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Version to package.json
        run: |
          VER="${{ needs.prepare.outputs.version_hash }}"
          sed -i "s|\"0.0.0\"|\"$VER\"|g" frontend/package.json
          sed -i "s|\"0.0.0\"|\"$VER\"|g" backend/package.json

      # --- Build Steps ---

      - name: "📦 Build Stage: Nginx Build"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nginx
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-nginx
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-nginx

      - name: "📦 Build Stage: Certbot"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: certbot
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-certbot
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-certbot

      - name: "📦 Build Stage: Frontend"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-frontend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-frontend

      - name: "📦 Build Stage: Backend"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-backend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-backend

      - name: "📦 Build Stage: Cloudflared"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: cloudflared
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-cloudflared
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-cloudflared

      - name: "🚀 Build Final & Push"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          build-args: |
            ${{ matrix.flags }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}-frontend
            type=gha,scope=${{ matrix.arch }}-backend
            type=gha,scope=${{ matrix.arch }}-nginx
            type=gha,scope=${{ matrix.arch }}-certbot
            type=gha,scope=${{ matrix.arch }}-cloudflared
            type=gha,scope=${{ matrix.arch }}-final
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-final

      # --- NEW: LXC Export with Patches (Here only!) ---
      - name: "📦 Export LXC Rootfs Template"
        run: |
          # 1. Create temporary container from the built image (do not start)
          docker create --name temp-lxc-export ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          
          # 2. Create & inject ShieldPM Environment file
          cat <<EOF > shieldpm.env
          # ----------------------------------------------------------------------
          # ShieldPM LXC Environment Configuration
          # This file is loaded in Proxmox/LXC when the start command is set to:
          # cmd: /bin/sh -c ". /etc/shieldpm.env && /usr/local/bin/entrypoint.sh"
          # ----------------------------------------------------------------------
          
          # -- Timezone --
          export TZ=Europe/Berlin

          # -- Let's Encrypt / SSL --
          # export ACME_EMAIL=admin@changeme.com
          # export ACME_SERVER=https://acme-v02.api.letsencrypt.org/directory
          # export ACME_EAB_KID=
          # export ACME_EAB_HMAC_KEY=

          # -- Features --
          export TOR_ENABLED=true
          export LOGROTATE=true
          EOF
          
          docker cp shieldpm.env temp-lxc-export:/etc/shieldpm.env
          
          # 3. Patch scripts (Extract from container -> modify -> push back)
          # Reason: $PATH is often missing in LXC, so we must force absolute paths.
          
          echo "Patching entrypoint.sh..."
          docker cp temp-lxc-export:/usr/local/bin/entrypoint.sh .
          sed -i 's|exec envs.sh|exec /usr/local/bin/envs.sh|g' entrypoint.sh
          docker cp entrypoint.sh temp-lxc-export:/usr/local/bin/entrypoint.sh
          
          echo "Patching envs.sh..."
          docker cp temp-lxc-export:/usr/local/bin/envs.sh .
          sed -i 's|exec migration.sh|exec /usr/local/bin/migration.sh|g' envs.sh
          docker cp envs.sh temp-lxc-export:/usr/local/bin/envs.sh
          
          echo "Patching migration.sh..."
          if docker cp temp-lxc-export:/usr/local/bin/migration.sh . 2>/dev/null; then
            sed -i 's|exec launch.sh|exec /usr/local/bin/launch.sh|g' migration.sh
            docker cp migration.sh temp-lxc-export:/usr/local/bin/migration.sh
          fi
          
          # 4. Export filesystem (removes Docker-specific layers)
          docker export temp-lxc-export > rootfs.tar
          
          # 5. Cleanup
          docker rm temp-lxc-export
          rm shieldpm.env entrypoint.sh envs.sh migration.sh || true
          
          # 6. Compress for Proxmox/LXC
          gzip -9 -c rootfs.tar > shieldpm-lxc-${{ matrix.arch }}.tar.gz

      - name: "Upload LXC Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: lxc-template-${{ matrix.arch }}
          path: shieldpm-lxc-${{ matrix.arch }}.tar.gz
          retention-days: 5

  # ---------------------------------------------------------
  # PHASE 3: MERGE (Create Manifest)
  # ---------------------------------------------------------
  merge:
    name: "🔗 Merge Multiarch Image"
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Multiarch Manifest
        run: |
          TAG_BASE="${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}"
          
          docker buildx imagetools create --tag "${TAG_BASE}" \
            "${TAG_BASE}-x86_64" \
            "${TAG_BASE}-aarch64"

      - name: "Add PR Comment"
        uses: mshick/add-pr-comment@v2
        if: ${{ needs.prepare.outputs.is_pr == 'true' }}
        with:
          message: |
            ✅ **Build Successful!**
            
            **Docker Image:**
            `${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}`
            
            **LXC Templates (RootFS):**
            Contains `/etc/shieldpm.env` and path fixes.
            Download available under "Artifacts":
            - `lxc-template-x86_64`
            - `lxc-template-aarch64`
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          refresh-message-position: true
