name: Build Docker Image

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - global/certbot-dns-plugins.json
      - frontend/**
      - backend/**
      - rootfs/**
      - nginx-quic/**
      - .version
      - "**/package.json"

    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - global/certbot-dns-plugins.json
      - frontend/**
      - backend/**
      - rootfs/**
      - nginx-quic/**
      - .version
      - "**/package.json"

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/shedowe19/shieldpm
  LXC_TEMPLATE_NAME: "" # Placeholder for linter

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------
  # PHASE 1: VORBEREITUNG (Version & Base-Tag berechnen)
  # ---------------------------------------------------------
  prepare:
    name: "⚙️ Prepare & Version"
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    outputs:
      version_hash: ${{ steps.calc.outputs.hash }}
      version: ${{ steps.calc.outputs.version }}
      docker_tag_base: ${{ steps.calc.outputs.tag_base }}
      is_pr: ${{ steps.calc.outputs.is_pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: "Calculate Version & Tags"
        id: calc
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(cat .version)
          echo "hash=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CLEAN_PR=$(echo pr-${{ github.ref_name }} | sed "s|refs/pull/:||g" | sed "s|/merge||g")
            echo "tag_base=${CLEAN_PR}" >> $GITHUB_OUTPUT
            echo "is_pr=true" >> $GITHUB_OUTPUT
          else
            echo "tag_base=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------
  # PHASE 2: BAUEN (Matrix für x86 und ARM)
  # ---------------------------------------------------------
  build:
    name: "🏗️ Build ${{ matrix.arch }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            flags: "FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            flags: "FLAGS=-mbranch-protection=standard"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Version to package.json
        run: |
          VER="${{ needs.prepare.outputs.version_hash }}"
          sed -i "s|\"0.0.0\"|\"$VER\"|g" frontend/package.json
          sed -i "s|\"0.0.0\"|\"$VER\"|g" backend/package.json
          # Save full commit hash for update-shieldpm
          echo "${{ github.sha }}" > backend/.git-commit

      # --- Build Steps ---

      - name: "📦 Build Stage: Frontend"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-frontend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-frontend

      - name: "📦 Build Stage: Backend"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-backend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-backend

      - name: "🚀 Build Final & Push"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          build-args: |
            ${{ matrix.flags }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}-frontend
            type=gha,scope=${{ matrix.arch }}-backend
            type=gha,scope=${{ matrix.arch }}-final

          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-final

      # ---------------------------------------------------------
      # NEW: Native Installer Package (Generic .tar.gz)
      # Uses pre-built nginx binaries from GitHub Releases
      # ---------------------------------------------------------
      - name: "📦 Create Native Installer Package"
        run: |
          # 1. Pull Image (For app/html only)
          TAG="${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}"
          docker pull "$TAG"

          # 2. Create Temp Container
          CONTAINER_NAME="installer-extractor-${{ matrix.arch }}"
          docker create --name "$CONTAINER_NAME" "$TAG"

          # 3. Determine Architecture Suffix
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_SUFFIX="amd64"
          elif [ "${{ matrix.arch }}" == "aarch64" ]; then
            ARCH_SUFFIX="arm64"
          else
            ARCH_SUFFIX="${{ matrix.arch }}"
          fi

          # 4. Create Build Dir
          BUILD_DIR="build/native-package"
          mkdir -p "$BUILD_DIR/app" "$BUILD_DIR/html"

          # 5. Extract App & Frontend from Docker (these are ShieldPM-specific)
          docker cp "$CONTAINER_NAME":/app/. "$BUILD_DIR/app/"
          docker cp "$CONTAINER_NAME":/html/. "$BUILD_DIR/html/"
          docker rm -f "$CONTAINER_NAME"

          # 6. Download Pre-built Nginx Binaries from Release
          echo "Downloading nginx-linux-${ARCH_SUFFIX}.tar.gz from GitHub Releases..."
          RELEASE_URL="https://github.com/shedowe19/ShieldPM/releases/download/nginx-binaries/nginx-linux-${ARCH_SUFFIX}.tar.gz"
          curl -L -f -o nginx-binaries.tar.gz "$RELEASE_URL"
          
          # 7. Extract Nginx Binaries
          echo "Extracting nginx binaries..."
          tar -xzf nginx-binaries.tar.gz -C "$BUILD_DIR"
          rm nginx-binaries.tar.gz

          # 8. Rootfs overlays (From Repo)
          cp -r rootfs "$BUILD_DIR/"
          
          # 9. Add Installer Script
          cp scripts/install.sh "$BUILD_DIR/install.sh"
          chmod +x "$BUILD_DIR/install.sh"
          
          # 10. Package
          TAR_NAME="shieldpm-install-linux-${ARCH_SUFFIX}.tar.gz"
          tar -czf "$TAR_NAME" -C "$BUILD_DIR" .
          echo "INSTALLER_PKG=$TAR_NAME" >> $GITHUB_ENV
          
          # Cleanup
          rm -rf "$BUILD_DIR"

      - name: "📤 Upload Native Installer"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shieldpm-install-linux-${{ matrix.arch }}
          path: ${{ env.INSTALLER_PKG }}
          if-no-files-found: error

      # ---------------------------------------------------------
      # OPTIONAL: Proxmox LXC Template Creation (Systemd-Patched)
      # Now for both x86_64 and aarch64
      # ---------------------------------------------------------
      - name: "📦 Create Proxmox LXC Template"
        id: lxc
        # if: matrix.arch == 'x86_64' # Enable for both architectures
        run: |
          # 1. Pull the image we just pushed/built to ensure it's local
          TAG="${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}"
          docker pull "$TAG"

          # 2. Run a temporary builder container
          # We start it with a sleep entrypoint so we can exec patches into it
          CONTAINER_NAME="lxc-builder-${{ matrix.arch }}"
          docker run -d --name "$CONTAINER_NAME" --entrypoint /bin/sleep --user 0:0 --privileged "$TAG" infinity

          # 3. PATCH: Install Systemd & Networking (Required for LXC)
          echo "Installing Systemd & Networking tools..."
          docker exec "$CONTAINER_NAME" apt-get update
          docker exec "$CONTAINER_NAME" apt-get install -y --no-install-recommends \
            systemd-sysv \
            ifupdown \
            net-tools \
            iproute2 \
            isc-dhcp-client \
            udev \
            qemu-guest-agent \
            keyutils \
            nfs-common \
            cifs-utils \
            fuse \
            openssh-server \
            nano \
            curl

          # 4. PATCH: Fix Systemd for Containers
          # Mask services that fail in unprivileged containers
          echo "Masking incompatible systemd units..."
          docker exec "$CONTAINER_NAME" systemctl mask \
            systemd-remount-fs.service \
            dev-hugepages.mount \
            sys-fs-fuse-connections.mount \
            systemd-logind.service \
            getty.target \
            console-getty.service

          # Enable standard Getty on tty1 for Proxmox Console
          docker exec "$CONTAINER_NAME" systemctl enable getty@tty1.service

          # Enable ShieldPM Service (Autostart)
          docker exec "$CONTAINER_NAME" systemctl enable shieldpm.service
          
          # Alias update command
          docker exec "$CONTAINER_NAME" ln -s /usr/local/bin/update-shieldpm /usr/bin/update

          # 5. Cleanup to reduce size
          docker exec "$CONTAINER_NAME" apt-get clean
          docker exec "$CONTAINER_NAME" rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*

          # 6. Export Rootfs
          echo "Exporting Rootfs..."
          docker export "$CONTAINER_NAME" -o rootfs.tar
          
          # 7. Compress (Standard Proxmox format: .tar.gz or .tar.xz)
          echo "Compressing..."
          gzip -9 rootfs.tar
          
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_SUFFIX="amd64"
          elif [ "${{ matrix.arch }}" == "aarch64" ]; then
            ARCH_SUFFIX="arm64"
          else
            ARCH_SUFFIX="${{ matrix.arch }}"
          fi
          
          FILE_NAME="shieldpm-${{ needs.prepare.outputs.docker_tag_base }}-lxc_${ARCH_SUFFIX}.tar.gz"
          mv rootfs.tar.gz "$FILE_NAME"
          
          echo "LXC_TEMPLATE_NAME=$FILE_NAME" >> $GITHUB_ENV
          
          # Cleanup
          docker rm -f "$CONTAINER_NAME"

      - name: "📤 Upload LXC Template"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # ÄNDERUNG: ${{ matrix.arch }} zum Namen hinzufügen
          name: shieldpm-lxc-template-${{ matrix.arch }}
          path: ${{ env.LXC_TEMPLATE_NAME }}
          if-no-files-found: error

  # ---------------------------------------------------------
  # PHASE 3: ZUSAMMENFÜGEN (Manifest erstellen)
  # ---------------------------------------------------------
  merge:
    name: "🔗 Merge Multiarch Image"
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Multiarch Manifest
        run: |
          TAG_BASE="${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}"
          
          docker buildx imagetools create --tag "${TAG_BASE}" \
            "${TAG_BASE}-x86_64" \
            "${TAG_BASE}-aarch64"

      - name: "Add PR Comment"
        uses: mshick/add-pr-comment@f4a1cfec85787e0670886207dab740578eb57597 # v3
        if: ${{ needs.prepare.outputs.is_pr == 'true' }}
        with:
          message: "The Docker Image can now be found here: `${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}`"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          refresh-message-position: true

  # ---------------------------------------------------------
  # PHASE 4: RELEASE (Artifacts as GitHub Release)
  # ---------------------------------------------------------
  release:
    name: "📦 Upload Release Artifacts"
    needs: [prepare, build, merge]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'shedowe19' }}
    permissions:
      contents: write
    steps:
      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download LXC Template (x86_64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shieldpm-lxc-template-x86_64
          path: release-assets

      - name: Download LXC Template (aarch64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shieldpm-lxc-template-aarch64
          path: release-assets

      - name: Download Native Installer (x86_64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shieldpm-install-linux-x86_64
          path: release-assets

      - name: Download Native Installer (aarch64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shieldpm-install-linux-aarch64
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          name: "ShieldPM v${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.docker_tag_base }}-${{ needs.prepare.outputs.version_hash }})"
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## 🛡️ ShieldPM ${{ needs.prepare.outputs.docker_tag_base }}

            ### 🐳 Docker
            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}
            ```

            ---

            ### 📦 Native Installer (Debian Trixie)
            > **Designed for Debian 13 (Trixie).**
            > Since all required apt packages are included, **all ShieldPM features (including CrowdSec, WAF, etc.) can be enabled** without manual dependency installation.

            Download the appropriate installer for your architecture:
            - **AMD64 (Intel/AMD):** `shieldpm-install-linux-amd64.tar.gz`
            - **ARM64 (Raspberry Pi/Ampere):** `shieldpm-install-linux-arm64.tar.gz`

            ```bash
            # Extract and run
            tar -xzf shieldpm-install-linux-*.tar.gz
            sudo ./install.sh
            ```
            
            **Update:** Run `update` or `update-shieldpm` anytime to fetch the latest version.

            ---

            ### 🖥️ Proxmox LXC Template
            > **Based on Debian 13 (Trixie).**
            > All ShieldPM features (including CrowdSec, WAF, etc.) are pre-installed and ready to use.

            Download the appropriate LXC template for your architecture:
            - **AMD64:** `shieldpm-${{ needs.prepare.outputs.docker_tag_base }}-lxc_amd64.tar.gz`
            - **ARM64:** `shieldpm-${{ needs.prepare.outputs.docker_tag_base }}-lxc_arm64.tar.gz`

            1. Upload to Proxmox: **Datacenter → Storage → CT Templates**
            2. Create Container with the template
            3. Enable **Nesting** in Options
            4. Start and access via `https://<IP>:81`

            **Update:** Run `update` in the container console to update ShieldPM and Nginx binaries.

            > ⚠️ **Note:** The `NGINX_QUIC_BPF=true` feature requires a **privileged** container. BPF is not available in unprivileged LXC containers.

            ---

            ### 📖 Documentation
            - [Installation Guide](https://github.com/shedowe19/ShieldPM/wiki/Installation)
            - [Proxmox LXC Guide](https://github.com/shedowe19/ShieldPM/wiki/Proxmox-LXC)
