name: Promote immutable Docker digest

on:
  workflow_dispatch:
    inputs:
      source_digest:
        description: "Reviewed multi-architecture digest (sha256:...)"
        required: true
        type: string
      source_revision:
        description: "Exact 40-character Git commit built into the image"
        required: true
        type: string
      release_tag:
        description: "New immutable release tag (vX.Y.Z)"
        required: true
        type: string
      promote_latest:
        description: "Also move latest to this reviewed digest"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/shedowe19/shieldpm

concurrency:
  group: promote-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'shedowe19'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate immutable promotion input
        env:
          DIGEST: ${{ inputs.source_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "source_digest must be a sha256 digest" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "release_tag must be a version tag" >&2
            exit 1
          }
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_revision must be an exact Git commit" >&2
            exit 1
          }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source and guard immutable destination
        env:
          DIGEST: ${{ inputs.source_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" --raw > source-index.json
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json" or
             .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json") and
            ([.manifests[].platform | select(.os == "linux") | .architecture] |
             index("amd64") != null and index("arm64") != null)
          ' source-index.json >/dev/null || {
            echo "source_digest must identify a Linux amd64/arm64 image index" >&2
            exit 1
          }
          for arch in amd64 arm64; do
            child_digest=$(jq -r --arg arch "$arch" '
              [.manifests[] |
               select(.platform.os == "linux" and .platform.architecture == $arch) |
               .digest][0] // empty
            ' source-index.json)
            [ -n "$child_digest" ] || {
              echo "source index is missing its Linux ${arch} child" >&2
              exit 1
            }

            docker pull --platform "linux/${arch}" "${IMAGE_NAME}@${child_digest}"
            image_arch=$(docker image inspect "${IMAGE_NAME}@${child_digest}" --format '{{.Architecture}}')
            image_source=$(docker image inspect "${IMAGE_NAME}@${child_digest}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
            image_version=$(docker image inspect "${IMAGE_NAME}@${child_digest}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            image_revision=$(docker image inspect "${IMAGE_NAME}@${child_digest}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            [ "$image_arch" = "$arch" ] || {
              echo "${arch} child reports unexpected architecture ${image_arch}" >&2
              exit 1
            }
            [ "$image_source" = "https://github.com/shedowe19/ShieldPM" ] || {
              echo "${arch} child has an unexpected source label" >&2
              exit 1
            }
            [ "$image_version" = "${RELEASE_TAG#v}" ] || {
              echo "release_tag does not match the ${arch} image version label" >&2
              exit 1
            }
            [ "$image_revision" = "$REVISION" ] || {
              echo "source_revision does not match the ${arch} image revision label" >&2
              exit 1
            }
          done
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite ${IMAGE_NAME}:${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Promote exact digest
        env:
          DIGEST: ${{ inputs.source_digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${RELEASE_TAG}" \
            "${IMAGE_NAME}@${DIGEST}"
          promoted=$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')
          [ "$promoted" = "$DIGEST" ] || {
            echo "Promoted tag does not resolve to the requested digest" >&2
            exit 1
          }

      - name: Promote latest to the same reviewed digest
        if: inputs.promote_latest
        env:
          DIGEST: ${{ inputs.source_digest }}
        run: |
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${DIGEST}"
          promoted=$(docker buildx imagetools inspect "${IMAGE_NAME}:latest" --format '{{.Manifest.Digest}}')
          [ "$promoted" = "$DIGEST" ] || {
            echo "latest does not resolve to the requested digest" >&2
            exit 1
          }
