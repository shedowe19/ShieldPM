name: Build latest Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'name of the release'
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/shedowe19/shieldpm

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------
  # PHASE 1: PREPARE
  # ---------------------------------------------------------
  prepare:
    name: "⚙️ Prepare & Version"
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    outputs:
      version: ${{ steps.calc.outputs.version }}
      docker_tag_base: ${{ steps.calc.outputs.tag_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Calculate Version & Tags"
        id: calc
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_FILE=$(cat .version)
          FULL_VER="${{ inputs.tag }}-${SHORT_SHA}-${VERSION_FILE}"
          
          echo "version=${FULL_VER}" >> $GITHUB_OUTPUT
          # Base tag for the arch-specific images will be 'latest'
          echo "tag_base=latest" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------
  # PHASE 2: BUILD (Matrix)
  # ---------------------------------------------------------
  build:
    name: "🏗️ Build ${{ matrix.arch }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            flags: "FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            flags: "FLAGS=-mbranch-protection=standard"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_PACKAGES }}

      - name: Apply Version to package.json
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          sed -i "s|\"0.0.0\"|\"$VER\"|g" frontend/package.json
          sed -i "s|\"0.0.0\"|\"$VER\"|g" backend/package.json

      # --- Build Stages with Caching ---

      - name: "📦 Build Stage: Nginx Build"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nginx
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-nginx
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-nginx

      - name: "📦 Build Stage: Certbot"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: certbot
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-certbot
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-certbot

      - name: "📦 Build Stage: Frontend"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-frontend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-frontend

      - name: "📦 Build Stage: Backend"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-backend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-backend

      - name: "📦 Build Stage: Cloudflared"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: cloudflared
          push: false
          build-args: |
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-cloudflared
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-cloudflared

      - name: "🚀 Build Final & Push"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # We use latest-arch here as the intermediate tag
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          build-args: |
            ${{ matrix.flags }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}-frontend
            type=gha,scope=${{ matrix.arch }}-backend
            type=gha,scope=${{ matrix.arch }}-nginx
            type=gha,scope=${{ matrix.arch }}-certbot
            type=gha,scope=${{ matrix.arch }}-cloudflared
            type=gha,scope=${{ matrix.arch }}-final
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-final

  # ---------------------------------------------------------
  # PHASE 3: MERGE
  # ---------------------------------------------------------
  merge:
    name: "🔗 Merge Multiarch Image"
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_PACKAGES }}

      - name: Create Multiarch Manifest
        run: |
          LATEST_TAG="${{ env.IMAGE_NAME }}:latest"
          INPUT_TAG="${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          RUN_TAG="${{ env.IMAGE_NAME }}:${{ github.run_number }}"
          
          # Create and push 'latest'
          docker buildx imagetools create --tag "${LATEST_TAG}" \
            "${LATEST_TAG}-x86_64" \
            "${LATEST_TAG}-aarch64"
            
          # Create and push input tag
          docker buildx imagetools create --tag "${INPUT_TAG}" \
            "${LATEST_TAG}-x86_64" \
            "${LATEST_TAG}-aarch64"
            
          # Create and push run number tag
          docker buildx imagetools create --tag "${RUN_TAG}" \
            "${LATEST_TAG}-x86_64" \
            "${LATEST_TAG}-aarch64"
