name: Build latest Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "name of the release"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/shedowe19/shieldpm
  SHIELDPM_NGINX_IMAGE: ${{ vars.SHIELDPM_NGINX_IMAGE }}

# Every dispatch promotes the same latest tags, regardless of ref.
concurrency:
  group: docker-latest-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------
  # PHASE 1: PREPARE
  # ---------------------------------------------------------
  prepare:
    name: "⚙️ Prepare & Version"
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    outputs:
      version: ${{ steps.calc.outputs.version }}
      docker_tag_base: ${{ steps.calc.outputs.tag_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "Calculate Version & Tags"
        id: calc
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Only a released semantic version that matches .version and points at
          # the checked-out commit may be promoted.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must be an exact vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          }
          VERSION_FILE=$(cat .version)
          [[ "$RELEASE_TAG" == "v$VERSION_FILE" ]] || {
            echo "Tag $RELEASE_TAG does not match .version ($VERSION_FILE)." >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" || "$GITHUB_REF" == "refs/heads/develop" ]] || {
            echo "Run this workflow from the matching release tag or develop." >&2
            exit 1
          }
          TAG_SHA=$(git ls-remote origin \
            "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin \
              "refs/tags/$RELEASE_TAG" | cut -f1)
          fi
          [[ -n "$TAG_SHA" && "$TAG_SHA" == "$GITHUB_SHA" ]] || {
            echo "Tag $RELEASE_TAG does not point at the checked-out commit." >&2
            exit 1
          }
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VER="${RELEASE_TAG}-${SHORT_SHA}-${VERSION_FILE}"

          echo "version=${FULL_VER}" >> $GITHUB_OUTPUT
          # Candidates cannot replace a published tag before both architectures pass.
          echo "tag_base=latest-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------
  # PHASE 2: BUILD (Matrix)
  # ---------------------------------------------------------
  build:
    name: "🏗️ Build ${{ matrix.arch }}"
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            flags: "FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            flags: "FLAGS=-mbranch-protection=standard"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Version to package.json
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          sed -i "s|\"0.0.0\"|\"$VER\"|g" frontend/package.json
          sed -i "s|\"0.0.0\"|\"$VER\"|g" backend/package.json

      - name: "🔐 Resolve pinned Nginx base image"
        id: base
        env:
          PINNED_NGINX_IMAGE: ${{ vars.SHIELDPM_NGINX_IMAGE }}
        run: |
          IMAGE="${PINNED_NGINX_IMAGE:-ghcr.io/shedowe19/shieldpm-nginx:master}"
          if [[ "$IMAGE" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            RESOLVED="$IMAGE"
          else
            DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unable to resolve an immutable Nginx base digest." >&2; exit 1; }
            RESOLVED="${IMAGE%@*}@${DIGEST}"
          fi
          [[ "$RESOLVED" == "ghcr.io/shedowe19/shieldpm-nginx@sha256:"* ]] || {
            echo "Nginx base must be ghcr.io/shedowe19/shieldpm-nginx pinned by sha256 digest." >&2
            exit 1
          }
          echo "image=$RESOLVED" >> "$GITHUB_OUTPUT"

      # --- Build Stages with Caching ---

      - name: "📦 Build Stage: Frontend"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: false
          outputs: type=cacheonly
          build-args: |
            SHIELDPM_NGINX_IMAGE=${{ steps.base.outputs.image }}
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-frontend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-frontend

      - name: "📦 Build Stage: Backend"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: false
          outputs: type=cacheonly
          build-args: |
            SHIELDPM_NGINX_IMAGE=${{ steps.base.outputs.image }}
            ${{ matrix.flags }}
          cache-from: type=gha,scope=${{ matrix.arch }}-backend
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-backend

      - name: "🏗️ Build and load candidate image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          build-args: |
            SHIELDPM_NGINX_IMAGE=${{ steps.base.outputs.image }}
            ${{ matrix.flags }}
          cache-from: |
            type=gha,scope=${{ matrix.arch }}-frontend
            type=gha,scope=${{ matrix.arch }}-backend
            type=gha,scope=${{ matrix.arch }}-final
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-final

      - name: "🌍 Smoke GeoIP bootstrap from latest release"
        timeout-minutes: 10
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          GEOIP_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/geoip-update-smoke.sh "$SMOKE_IMAGE"

      - name: "🧪 Smoke loaded image as root and UID 1000"
        timeout-minutes: 10
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
        run: bash scripts/ci/docker-smoke.sh "$SMOKE_IMAGE"

      - name: "📤 Push tested candidate and record its digest"
        env:
          SMOKE_IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.docker_tag_base }}-${{ matrix.arch }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker push "$SMOKE_IMAGE"
          IMAGE_REF=$(docker image inspect --format '{{index .RepoDigests 0}}' "$SMOKE_IMAGE")
          DIGEST=${IMAGE_REF#"$IMAGE_NAME@"}
          [[ "$IMAGE_REF" == "$IMAGE_NAME@$DIGEST" && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mkdir -p image-digests
          printf '%s\n' "$IMAGE_REF" > "image-digests/$IMAGE_ARCH.txt"

      - name: "📤 Upload tested image digest"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-image-digest-${{ matrix.arch }}
          path: image-digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # ---------------------------------------------------------
  # PHASE 3: MERGE
  # ---------------------------------------------------------
  merge:
    name: "🔗 Merge Multiarch Image"
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'shedowe19' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: latest-image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Create Multiarch Manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          LATEST_TAG="${{ env.IMAGE_NAME }}:latest"
          INPUT_TAG="${{ env.IMAGE_NAME }}:${RELEASE_TAG}"
          RUN_TAG="${{ env.IMAGE_NAME }}:${{ github.run_number }}"

          # Validate both immutable references before changing any published tag.
          IMAGES=()
          for ARCH in x86_64 aarch64; do
            IMAGE_REF=$(cat "image-digests/$ARCH.txt")
            DIGEST=${IMAGE_REF#"$IMAGE_NAME@"}
            [[ "$IMAGE_REF" == "$IMAGE_NAME@$DIGEST" && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            IMAGES+=("$IMAGE_REF")
          done

          docker buildx imagetools create \
            --tag "$LATEST_TAG" --tag "$INPUT_TAG" --tag "$RUN_TAG" \
            "${IMAGES[@]}"

          # Keep existing architecture tags, promoting only already-tested images.
          docker buildx imagetools create --prefer-index=false --tag "${LATEST_TAG}-x86_64" "${IMAGES[0]}"
          docker buildx imagetools create --prefer-index=false --tag "${LATEST_TAG}-aarch64" "${IMAGES[1]}"
