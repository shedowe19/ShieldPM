name: Dependency fix notice validation

on:
  push:
    branches:
      - codex/fix-dependency-tests

permissions:
  contents: read

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install notice validation tools
        run: npm install --global yarn@1.22.22 license-checker@25.0.1
      - name: Install exact application and scanner dependencies
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd backend install --frozen-lockfile
          yarn --cwd .tscanner install --frozen-lockfile --ignore-scripts --production=false
      - name: Generate installed dependency notices
        run: node scripts/generate-notices.js
      - name: Preserve generated notices
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-fix-notices
          path: THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 7
