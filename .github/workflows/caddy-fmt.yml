name: Format Caddyfile
on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/caddy-fmt.yml
      - caddy/Dockerfile
      - caddy/Caddyfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^COPY --from=caddy:([0-9.]+).*/\1/p' caddy/Dockerfile | head -1)"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify Caddyfile formatting
        shell: bash
        run: |
          formatted="$(mktemp)"
          docker run --rm \
            --volume "${{ github.workspace }}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "caddy:${{ steps.version.outputs.version }}" \
            caddy fmt /etc/caddy/Caddyfile > "$formatted"
          diff --unified caddy/Caddyfile "$formatted"
