name: Format Caddyfile
on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/caddy-fmt.yml
      - caddy/Dockerfile
      - caddy/Caddyfile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  caddy-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read pinned Caddy image
        id: caddy
        run: |
          image="$(sed -n 's/^FROM \(caddy:.*\) AS caddy$/\1/p' caddy/Dockerfile)"
          case "$image" in
            caddy:2.11.4@sha256:[0-9a-f]*) ;;
            *) echo "Caddy image must be an immutable 2.11.4 reference" >&2; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: caddy-fmt
        run: |
          docker run --rm -v ${{ github.workspace }}/caddy/Caddyfile:/etc/caddy/Caddyfile ${{ steps.caddy.outputs.image }} caddy fmt --overwrite /etc/caddy/Caddyfile
      - name: push changes
        run: |
          git add caddy/Caddyfile
          git config user.name "GitHub"
          git config user.email "noreply@github.com"
          git diff-index --quiet HEAD || git commit -sm "caddy fmt"
          git push
