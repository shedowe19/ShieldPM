name: NPM Dependency Updates

on:
  schedule:
    # Run every day at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: "yarn"
          cache-dependency-path: |
            frontend/yarn.lock
            backend/yarn.lock

      - name: Install dependency update tools
        run: |
          npm install --global npm-check-updates@22.2.9 license-checker@25.0.1
          NPM_GLOBAL_BIN="$(npm prefix --global)/bin"
          test -x "$NPM_GLOBAL_BIN/ncu"
          test -x "$NPM_GLOBAL_BIN/license-checker"
          printf '%s\n' "$NPM_GLOBAL_BIN" >> "$GITHUB_PATH"

      - name: Update Frontend Dependencies
        working-directory: ./frontend
        run: |
          echo "Installing the locked frontend dependency baseline..."
          npx --yes --package yarn@1.22.22 yarn install --frozen-lockfile

          echo "Checking for latest dependency updates..."
          echo "### Frontend Updates" > /tmp/frontend-updates.txt
          echo '```text' >> /tmp/frontend-updates.txt
          ncu -u --target latest >> /tmp/frontend-updates.txt
          echo '```' >> /tmp/frontend-updates.txt

          echo "Installing updated frontend dependencies to update yarn.lock..."
          npx --yes --package yarn@1.22.22 yarn install

          echo "Deduplicating compatible frontend lockfile entries..."
          npx --yes --package yarn-deduplicate@6.0.0 yarn-deduplicate --strategy highest yarn.lock

          echo "Reinstalling the deduplicated frontend lockfile..."
          npx --yes --package yarn@1.22.22 yarn install --frozen-lockfile

      - name: Update Backend Dependencies
        working-directory: ./backend
        run: |
          echo "Installing the locked backend dependency baseline..."
          npx --yes --package yarn@1.22.22 yarn install --frozen-lockfile

          echo "Checking for latest dependency updates..."
          echo "### Backend Updates" > /tmp/backend-updates.txt
          echo '```text' >> /tmp/backend-updates.txt
          ncu -u --target latest >> /tmp/backend-updates.txt
          echo '```' >> /tmp/backend-updates.txt

          echo "Installing updated backend dependencies to update yarn.lock..."
          npx --yes --package yarn@1.22.22 yarn install

      - name: Check for Direct Dependency Updates
        id: check_changes
        run: |
          if git diff --quiet frontend/package.json backend/package.json; then
            echo "No direct dependencies were updated."
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Direct dependencies were updated."
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize verified dependency documentation
        if: steps.check_changes.outputs.updates_found == 'true'
        run: node scripts/sync-verified-dependency-docs.js

      - name: Generate Third-Party Notices
        if: steps.check_changes.outputs.updates_found == 'true'
        run: node scripts/generate-notices.js

      - name: Run dependency verification
        if: steps.check_changes.outputs.updates_found == 'true'
        run: |
          (cd backend && npx --yes --package yarn@1.22.22 yarn test --run)
          (cd frontend && npx --yes --package yarn@1.22.22 yarn test --run)
          (cd frontend && npx --yes --package yarn@1.22.22 yarn build)

      - name: Require dedicated pull request token
        if: steps.check_changes.outputs.updates_found == 'true'
        env:
          DEPENDENCY_UPDATES_TOKEN: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
        run: |
          if [ -z "$DEPENDENCY_UPDATES_TOKEN" ]; then
            echo "::error::DEPENDENCY_UPDATES_TOKEN is required to create a PR that triggers normal workflow checks."
            exit 1
          fi

      - name: Prepare PR Body
        if: steps.check_changes.outputs.updates_found == 'true'
        run: |
          echo "## Automated Dependency Updates" > /tmp/pr_body.txt
          echo "This PR updates direct frontend and backend dependencies to their latest published versions." >> /tmp/pr_body.txt
          echo "" >> /tmp/pr_body.txt
          cat /tmp/frontend-updates.txt >> /tmp/pr_body.txt
          echo "" >> /tmp/pr_body.txt
          cat /tmp/backend-updates.txt >> /tmp/pr_body.txt
          echo "" >> /tmp/pr_body.txt
          echo "### Verification" >> /tmp/pr_body.txt
          echo "- Validated the installed Vite/Rolldown dependency baseline against the internal wiki." >> /tmp/pr_body.txt
          echo "- Regenerated \`THIRD-PARTY-NOTICES.md\` after all license scans succeeded." >> /tmp/pr_body.txt
          echo "- Ran backend tests, frontend tests, and the frontend production build." >> /tmp/pr_body.txt

      - name: Create Pull Request
        if: steps.check_changes.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
          base: "develop"
          signoff: true
          delete-branch: true
          commit-message: "chore(deps): update frontend and backend dependencies"
          branch: "update-all-deps"
          title: "chore(deps): update npm dependencies"
          body-path: /tmp/pr_body.txt
