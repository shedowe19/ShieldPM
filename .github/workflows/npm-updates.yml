name: NPM dependency updates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-dependency-updates
  cancel-in-progress: false

env:
  COREPACK_VERSION: 0.36.0
  YARN_VERSION: 4.18.0

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0

      - name: Activate pinned package manager
        run: |
          npm install --global --ignore-scripts "corepack@$COREPACK_VERSION" npm-check-updates@23.0.2
          corepack enable
          corepack install --global "yarn@$YARN_VERSION"
          yarn --version
          ncu --version

      - name: Install locked dependency baseline
        run: |
          yarn --cwd frontend install --immutable
          yarn --cwd backend install --immutable

      - name: Update frontend dependencies
        working-directory: frontend
        run: |
          printf '### Frontend updates\n\n```text\n' > /tmp/frontend-updates.txt
          ncu --upgrade --target latest | tee -a /tmp/frontend-updates.txt
          printf '```\n' >> /tmp/frontend-updates.txt
          yarn install
          yarn dedupe --strategy highest
          yarn install --immutable

      - name: Update backend dependencies
        working-directory: backend
        run: |
          printf '### Backend updates\n\n```text\n' > /tmp/backend-updates.txt
          ncu --upgrade --target latest | tee -a /tmp/backend-updates.txt
          printf '```\n' >> /tmp/backend-updates.txt
          yarn install
          yarn dedupe --strategy highest
          yarn install --immutable

      - name: Check for direct dependency updates
        id: check_changes
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json backend/package.json; then
            echo "No direct dependencies were updated."
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Direct dependencies were updated."
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize verified dependency documentation
        if: steps.check_changes.outputs.updates_found == 'true'
        run: node scripts/sync-verified-dependency-docs.js

      - name: Generate deterministic third-party notices
        if: steps.check_changes.outputs.updates_found == 'true'
        run: |
          node --test scripts/generate-notices.test.js
          node scripts/generate-notices.js

      - name: Run dependency verification
        if: steps.check_changes.outputs.updates_found == 'true'
        run: |
          yarn --cwd backend check
          yarn --cwd backend tsc --noEmit
          yarn --cwd backend test --run
          yarn --cwd frontend check
          yarn --cwd frontend tsc --noEmit
          yarn --cwd frontend test --run
          node frontend/check-locales.cjs
          yarn --cwd frontend build
          yarn --cwd backend npm audit --recursive --severity high
          yarn --cwd frontend npm audit --recursive --severity high
          git diff --check

      - name: Require dedicated pull request token
        if: steps.check_changes.outputs.updates_found == 'true'
        env:
          DEPENDENCY_UPDATES_TOKEN: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
        run: |
          if [[ -z "$DEPENDENCY_UPDATES_TOKEN" ]]; then
            echo "::error::DEPENDENCY_UPDATES_TOKEN is required so the pull request triggers normal workflow checks."
            exit 1
          fi

      - name: Prepare pull request body
        if: steps.check_changes.outputs.updates_found == 'true'
        run: |
          {
            printf '## Automated dependency updates\n\n'
            printf 'This pull request updates direct frontend and backend dependencies and regenerates their Yarn 4 lockfiles.\n\n'
            cat /tmp/frontend-updates.txt
            printf '\n'
            cat /tmp/backend-updates.txt
            printf '\n### Verification\n\n'
            printf -- '- Immutable Yarn 4 installs and lockfile deduplication\n'
            printf -- '- Biome, TypeScript, locale, test, and production-build gates\n'
            printf -- '- Fail-closed high/critical dependency audits\n'
            printf -- '- Deterministic direct-dependency license notices\n'
          } > /tmp/pr-body.md

      - name: Create pull request
        if: steps.check_changes.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
          base: develop
          signoff: true
          delete-branch: true
          commit-message: "chore(deps): update frontend and backend dependencies"
          branch: automation/npm-dependency-updates
          title: "chore(deps): update npm dependencies"
          body-path: /tmp/pr-body.md
