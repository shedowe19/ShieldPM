name: Wiki Sync

on:
  push:
    branches:
      - develop
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Sync Wiki
        uses: Newrez/bi-directional-wiki-sync-action@v1.0.1
        with:
          source: docs/wiki
          destination: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          gitAuthorName: ${{ github.actor }}
          gitAuthorEmail: ${{ github.actor }}@users.noreply.github.com
