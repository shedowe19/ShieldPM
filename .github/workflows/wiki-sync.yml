name: Wiki sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-public-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Synchronize public documentation to the repository wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [[ -z "$WIKI_TOKEN" ]]; then
            echo "::error::WIKI_TOKEN is required for an explicitly requested wiki synchronization."
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 --wrap=0)"
          wiki_directory="$RUNNER_TEMP/shieldpm-wiki"
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            clone "$wiki_url" "$wiki_directory"
          rsync --archive --delete --exclude .git/ docs/wiki/ "$wiki_directory/"
          git -C "$wiki_directory" add --all

          if git -C "$wiki_directory" diff --cached --quiet; then
            echo "The public wiki is already synchronized."
            exit 0
          fi

          git -C "$wiki_directory" config user.name "ShieldPM Wiki Bot"
          git -C "$wiki_directory" config user.email "actions@users.noreply.github.com"
          git -C "$wiki_directory" commit -m "docs: synchronize public wiki"
          git -C "$wiki_directory" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push origin HEAD
