name: Shellcheck
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Check Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Install Shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck libmaxminddb0
      - name: Run Shellcheck
        run: |
          find scripts rootfs -type f \( -name "*.sh" -o -name "*.bash" -o -name "update-shieldpm" -o -name "npm-reset-password" \) -exec shellcheck {} +
      - name: Test infrastructure helpers without system changes
        run: python3 -m unittest discover -s scripts/tests -v
