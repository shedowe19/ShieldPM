name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          default_branch="${{ github.event.repository.default_branch }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" >/dev/null 2>&1; then
            if ! git show-ref --verify --quiet "refs/remotes/origin/$default_branch"; then
              git fetch --no-tags origin "refs/heads/$default_branch:refs/remotes/origin/$default_branch"
            fi
            base="$(git merge-base HEAD "origin/$default_branch")"
          fi

          git cat-file -e "$base^{tree}"
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Check changed lines
        run: git diff --check "${{ steps.base.outputs.sha }}" HEAD

      - name: Scan added diff lines for recognizable token formats
        run: node backend/scripts/ci/scan-added-diff-secrets.js "${{ steps.base.outputs.sha }}"

      - name: Install backend dependencies
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/backend" install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/frontend" install --frozen-lockfile

      - name: Check changed backend JavaScript and TypeScript files
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "${{ steps.base.outputs.sha }}" HEAD -- backend | grep -z -E '\.(cjs|js|ts|tsx)$')
          if ((${#files[@]})); then
            cd "$GITHUB_WORKSPACE/backend"
            ./node_modules/.bin/biome check "${files[@]#backend/}"
          fi

      - name: Check changed frontend JavaScript and TypeScript files
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "${{ steps.base.outputs.sha }}" HEAD -- frontend | grep -z -E '\.(cjs|js|ts|tsx)$')
          if ((${#files[@]})); then
            cd "$GITHUB_WORKSPACE/frontend"
            ./node_modules/.bin/biome check "${files[@]#frontend/}"
          fi

      - name: Run backend tests
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/backend" test --run

      - name: Run frontend tests
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/frontend" test --run

      - name: Check frontend locales
        run: cd "$GITHUB_WORKSPACE/frontend" && node check-locales.cjs

      - name: Build frontend
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/frontend" build

      - name: "Audit backend dependencies (advisory: high and critical)"
        continue-on-error: true
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/backend" audit --level high

      - name: "Audit frontend dependencies (advisory: high and critical)"
        continue-on-error: true
        run: cd /tmp && npx --yes --package yarn@1.22.22 yarn --cwd "$GITHUB_WORKSPACE/frontend" audit --level high
