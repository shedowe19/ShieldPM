name: "CodeQL"

on:
  push:
    branches: [ "develop", "master", "main", "feature/*" ]
  pull_request:
    branches: [ "develop", "master", "main" ]
  schedule:
    - cron: '21 16 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports 'javascript' which includes both JavaScript and TypeScript
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
      with:
        languages: ${{ matrix.language }}
        # START CUSTOM CONFIGURATION
        config-file: ./.github/codeql/codeql-config.yml
        # END CUSTOM CONFIGURATION

    - name: Autobuild
      uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939 # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
      with:
        category: "/language:${{matrix.language}}"
