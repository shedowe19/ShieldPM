# Browser response headers for the ShieldPM administration vhost.
# This include is injected only into the admin `server_name _` block by start.sh.
# It deliberately mirrors the backend Helmet policy so static SPA and proxied API
# responses have one consistent policy.
more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
more_set_headers "Content-Security-Policy: default-src 'self'; base-uri 'self'; font-src 'self' https: data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https:; object-src 'none'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' https: 'unsafe-inline'; upgrade-insecure-requests; worker-src 'self' blob:; connect-src 'self' https://editor.swagger.io";
more_set_headers "X-Frame-Options: SAMEORIGIN";
