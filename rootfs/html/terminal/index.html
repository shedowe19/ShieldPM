<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldPM Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #terminal {
            width: 100%;
            height: 100%;
        }
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #eee;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-dot.connected { background: #4ade80; }
        .status-dot.connecting { background: #fbbf24; animation: pulse 1s infinite; }
        .status-dot.disconnected { background: #ef4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #terminal-container {
            position: fixed;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <span id="status-dot" class="status-dot connecting"></span>
        <span id="status-text">Connecting...</span>
    </div>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script>
        (function() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                theme: {
                    background: '#000000',
                }
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());

            term.open(document.getElementById('terminal'));
            fitAddon.fit();

            // Construct WebSocket URL from current page location
            // The Nginx config proxies /ws to the backend
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';

                // Send initial resize
                const dims = { cols: term.cols, rows: term.rows };
                ws.send(JSON.stringify({ type: 'resize', ...dims }));

                term.focus();
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'data') {
                        term.write(msg.data);
                    } else if (msg.type === 'error') {
                        term.write(`\r\n\x1b[31mError: ${msg.message}\x1b[0m\r\n`);
                        statusDot.className = 'status-dot disconnected';
                        statusText.textContent = 'Error';
                    } else if (msg.type === 'status' && msg.status === 'connected') {
                        statusDot.className = 'status-dot connected';
                        statusText.textContent = 'Connected';
                    }
                } catch (e) {
                    // Ignore parse errors
                }
            };

            ws.onclose = (event) => {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
                if (event.code === 1008) {
                    term.write(`\r\n\x1b[31mConnection closed: ${event.reason}\x1b[0m\r\n`);
                } else {
                    term.write('\r\n\x1b[31mConnection closed.\x1b[0m\r\n');
                }
            };

            ws.onerror = (e) => {
                console.error('WS Error', e);
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Connection Error';
                term.write('\r\n\x1b[31mConnection error.\x1b[0m\r\n');
            };

            term.onData((data) => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'data', data }));
                }
            });

            term.onResize((size) => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
                }
            });

            // Handle container resize
            const resizeObserver = new ResizeObserver(() => {
                fitAddon.fit();
            });
            resizeObserver.observe(document.getElementById('terminal-container'));
        })();
    </script>
</body>
</html>
