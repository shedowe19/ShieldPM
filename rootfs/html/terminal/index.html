<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ShieldPM Terminal</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css"
        integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD"
        crossorigin="anonymous"
    >
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #terminal {
            width: 100%;
            height: 100%;
            display: block;
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: #eee;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-dot.connected {
            background: #4ade80;
        }

        .status-dot.connecting {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        #terminal-container {
            position: fixed;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
        }
    </style>
</head>

<body>
    <div class="status-bar">
        <span id="status-dot" class="status-dot connecting"></span>
        <span id="status-text">Connecting...</span>
    </div>
    <div id="terminal-container">
        <div id="terminal"></div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"
        integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"
        integrity="sha384-txoiwu4RR2GD3qySbaj+BbzibkLbSJRcfqGYMu6z1EqHil4A2dyBiBW5dlacG6OR"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.js"
        integrity="sha384-0IIwkXq0LAkIxEVKxlOxWbje2g/VT+5CzVTZiEukyiZ02pOl/O+M0fkpEKAYqto9"
        crossorigin="anonymous"
    ></script>
    <script>
        (function () {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            let opening = false;

            function base64Url(bytes) {
                let binary = '';
                bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
                return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }

            function getClientFingerprint() {
                const key = 'shieldpm-terminal-client-fingerprint';
                let fingerprint = sessionStorage.getItem(key);
                if (!fingerprint || !/^[A-Za-z0-9_-]{43}$/.test(fingerprint)) {
                    fingerprint = base64Url(crypto.getRandomValues(new Uint8Array(32)));
                    sessionStorage.setItem(key, fingerprint);
                }
                return fingerprint;
            }

            const term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                theme: {
                    background: '#000000',
                },
                allowProposedApi: true
            });

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());

            term.open(document.getElementById('terminal'));

            // Recursive function to ensure fit until dimensions are non-zero
            function fitTerminal() {
                fitAddon.fit();
                if (term.cols <= 0 || term.rows <= 0) {
                    requestAnimationFrame(fitTerminal);
                } else {
                    console.log(`Terminal fitted: ${term.cols}x${term.rows}`);
                    openWebSocket();
                }
            }

            async function openWebSocket() {
                if (opening || window._ws) return;
                opening = true;
                const clientFingerprint = getClientFingerprint();
                let ticket;
                try {
                    const response = await fetch('/terminal-ticket', {
                        method: 'POST',
                        credentials: 'same-origin',
                        cache: 'no-store',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-ShieldPM-Client-Fingerprint': clientFingerprint
                        },
                        body: JSON.stringify({ clientFingerprint })
                    });
                    if (!response.ok) throw new Error('Terminal authorization failed');
                    const payload = await response.json();
                    if (!/^[A-Za-z0-9_-]{43}$/.test(payload.ticket || '')) {
                        throw new Error('Terminal authorization response was invalid');
                    }
                    ticket = payload.ticket;
                } catch (_error) {
                    statusDot.className = 'status-dot disconnected';
                    statusText.textContent = 'Authorization failed';
                    term.write('\r\n\x1b[31mTerminal authorization failed.\x1b[0m\r\n');
                    opening = false;
                    return;
                }

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                const ws = new WebSocket(wsUrl, [
                    'shieldpm-terminal',
                    `ticket.${ticket}`,
                    `fingerprint.${clientFingerprint}`
                ]);
                window._ws = ws;

                ws.onopen = () => {
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = 'Connected';
                    console.log('WS Open, sending initial resize:', term.cols, term.rows);

                    ws.send(JSON.stringify({
                        type: 'resize',
                        cols: term.cols,
                        rows: term.rows
                    }));

                    term.focus();
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'data') {
                            term.write(msg.data);
                        } else if (msg.type === 'error') {
                            term.write(`\r\n\x1b[31mError: ${msg.message}\x1b[0m\r\n`);
                            statusDot.className = 'status-dot disconnected';
                            statusText.textContent = 'Error';
                        } else if (msg.type === 'status' && msg.status === 'connected') {
                            statusDot.className = 'status-dot connected';
                            statusText.textContent = 'Connected';
                        }
                    } catch (e) {
                        // Ignore parse errors
                    }
                };

                ws.onclose = (event) => {
					window._ws = null;
					opening = false;
                    statusDot.className = 'status-dot disconnected';
                    statusText.textContent = 'Disconnected';
                    if (event.code === 1008) {
                        term.write(`\r\n\x1b[31mConnection closed: ${event.reason}\x1b[0m\r\n`);
                    } else {
                        term.write('\r\n\x1b[31mConnection closed.\x1b[0m\r\n');
                    }
                };

                ws.onerror = (e) => {
                    console.error('WS Error', e);
                    statusDot.className = 'status-dot disconnected';
                    statusText.textContent = 'Connection Error';
                    term.write('\r\n\x1b[31mConnection error.\x1b[0m\r\n');
                };

            }

            // Start fitting
            fitTerminal();

            const getWs = () => window._ws;

            term.onData((data) => {
                const ws = getWs();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'data', data }));
                }
            });

            term.onResize((size) => {
                const ws = getWs();
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
                }
            });

            // Handle container resize
            const resizeObserver = new ResizeObserver(() => {
                fitAddon.fit();
            });
            resizeObserver.observe(document.getElementById('terminal-container'));
        })();
    </script>
</body>

</html>
