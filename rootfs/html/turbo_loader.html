<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldPM Turbo Loader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }
        .header { margin-bottom: 30px; }
        .rocket { font-size: 48px; display: inline-block; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #10b981, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .filename {
            font-size: 14px; color: var(--text-muted); word-break: break-all;
            background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 8px;
            display: inline-block; font-family: monospace;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
        .stat-box {
            background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 16px; transition: transform 0.2s ease;
        }
        .stat-box:hover { transform: translateY(-2px); background: rgba(0,0,0,0.3); }
        .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .stat-value { font-size: 20px; font-weight: 600; }
        .primary-value { color: #10b981; }
        .speed-value { color: #38bdf8; }
        .eta-value { color: #f43f5e; }
        .progress-container { margin-bottom: 30px; position: relative; }
        .progress-bar-bg { height: 12px; background: rgba(0,0,0,0.3); border-radius: 999px; overflow: hidden; position: relative; }
        .progress-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            border-radius: 999px; width: 0%; transition: width 0.2s linear;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .chunks-container { display: flex; gap: 4px; margin-top: 12px; justify-content: space-between; }
        .chunk { flex: 1; height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; overflow: hidden; }
        .chunk-fill { height: 100%; background: #38bdf8; width: 0%; transition: width 0.2s linear; }
        .btn-start {
            background: linear-gradient(135deg, #10b981, #059669); color: white;
            border: none; padding: 16px 32px; font-size: 16px; font-weight: 600;
            border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .btn-start:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
        #error-msg { color: #ef4444; margin-top: 16px; font-size: 14px; display: none; }
        #shields-warn {
            display: none; margin-top: 14px; padding: 12px 16px;
            background: rgba(251, 146, 60, 0.12); border: 1px solid rgba(251, 146, 60, 0.35);
            border-radius: 10px; font-size: 13px; color: #fb923c; line-height: 1.5;
        }
        #save-btn {
            display: none; margin-top: 14px; width: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; border: none; padding: 14px 24px;
            font-size: 15px; font-weight: 600; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35);
        }
        #save-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.45); }
        #standard-btn {
            display: none; margin-top: 14px; width: 100%;
            background: rgba(51, 65, 85, 0.8); color: var(--text-main);
            border: 1px solid var(--glass-border); padding: 14px 24px;
            font-size: 15px; font-weight: 600; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        #standard-btn:hover { background: rgba(71, 85, 105, 0.9); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="rocket">🚀</div>
        <h1>Turbo-Loader</h1>
        <div class="filename" id="filename">Loading...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Progress</div>
            <div class="stat-value primary-value" id="percent">0%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Speed</div>
            <div class="stat-value speed-value" id="speed">0 MB/s</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">ETA</div>
            <div class="stat-value eta-value" id="eta">--:--</div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="main-progress"></div>
        </div>
        <div class="chunks-container" id="chunks"></div>
    </div>

    <button class="btn-start" id="start-btn">Start Turbo Download</button>
    <div id="shields-warn"></div>
    <button id="save-btn">💾 Click here to Save File</button>
    <button id="standard-btn">⬇️ Standard Download</button>
    <div id="error-msg"></div>
</div>

<script>
    const CHUNK_COUNT = 8;

    // Build the real file URL:
    // The page is served via Nginx internal rewrite, so window.location still reflects the original URL
    const params = new URLSearchParams(window.location.search);
    params.delete('turbo');
    const cleanSearch = params.toString() ? '?' + params.toString() + '&turbo=0' : '?turbo=0';
    const originUrl = window.location.pathname + cleanSearch;

    // IMPORTANT: Web Apps like Synology DSM (File Station), Nextcloud, etc. often initiate
    // downloads by creating a hidden iframe. If the Turbo-Loader UI is loaded inside a 
    // hidden iframe, the user cannot see or click anything -> "nothing happens".
    // Fix: Detect if we are embedded, and instantly fallback to standard download!
    if (window !== window.top) {
        window.location.replace(originUrl);
        throw new Error("Turbo-Loader is embedded in an iframe. Redirecting to standard download.");
    }

    let filename = window.location.pathname.split('/').pop() || 'downloaded_file';
    try { filename = decodeURIComponent(filename); } catch (_) { /* Keep malformed escapes readable. */ }
    let totalSize = 0;
    let fileValidator = null;
    let activeDownload = null;

    document.getElementById('filename').textContent = filename;

    const startBtn       = document.getElementById('start-btn');
    const chunksEl       = document.getElementById('chunks');
    const percentEl      = document.getElementById('percent');
    const speedEl        = document.getElementById('speed');
    const etaEl          = document.getElementById('eta');
    const progressEl     = document.getElementById('main-progress');
    const errorMsgEl     = document.getElementById('error-msg');
    const shieldsWarnEl  = document.getElementById('shields-warn');
    const saveBtnEl      = document.getElementById('save-btn');
    const standardBtnEl  = document.getElementById('standard-btn');

    startBtn.disabled = true;
    window.addEventListener('pagehide', () => {
        if (activeDownload) activeDownload.abort();
        if (pendingBlobUrl) URL.revokeObjectURL(pendingBlobUrl);
    });

    standardBtnEl.addEventListener('click', () => { window.location.href = originUrl; });

    // Will hold Blob URL when fallback assembles the file
    let pendingBlobUrl  = null;
    let pendingFilename = null;

    saveBtnEl.addEventListener('click', () => {
        if (!pendingBlobUrl) return;
        const a = document.createElement('a');
        const savedUrl = pendingBlobUrl;
        a.href = savedUrl; a.download = pendingFilename;
        document.body.appendChild(a); a.click();
        setTimeout(() => {
            URL.revokeObjectURL(savedUrl);
            a.remove();
            if (pendingBlobUrl === savedUrl) { pendingBlobUrl = null; saveBtnEl.style.display = 'none'; }
        }, 300);
    });

    // Build per-chunk progress bars
    for (let i = 0; i < CHUNK_COUNT; i++) {
        const c = document.createElement('div'); c.className = 'chunk';
        const f = document.createElement('div'); f.className = 'chunk-fill'; f.id = `chunk-${i}`;
        c.appendChild(f); chunksEl.appendChild(c);
    }

    function showError(msg) {
        errorMsgEl.textContent = msg;
        errorMsgEl.style.display = 'block';
        startBtn.disabled = false;
        startBtn.textContent = 'Retry Download';
    }

    function formatBytes(bytes, dec = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dec))} ${sizes[i]}`;
    }

    // ── init: probe the file via HEAD ──────────────────────────────────────────
    async function init() {
        try {
            const res = await fetch(originUrl, { method: 'HEAD' });

            if (res.status === 404) {
                showError('File not found (404). The path may be incorrect or the file does not exist on the server.');
                startBtn.textContent = 'Standard Download';
                startBtn.onclick = () => { window.location.href = originUrl; };
                return;
            }
            if (!res.ok) {
                throw new Error(`Server returned HTTP ${res.status}`);
            }

            totalSize = Number(res.headers.get('Content-Length'));
            const etag = res.headers.get('ETag');
            fileValidator = etag && !etag.startsWith('W/') ? etag : res.headers.get('Last-Modified');
            const acceptRanges = res.headers.get('Accept-Ranges');

            if (!Number.isSafeInteger(totalSize) || totalSize <= 0 || acceptRanges === 'none') {
                showError('Server does not report a file size or does not support Range requests. Using standard download.');
                startBtn.textContent = 'Standard Download';
                startBtn.disabled = false;
                startBtn.onclick = () => { window.location.href = originUrl; };
                return;
            }

            startBtn.disabled = false;
            startBtn.addEventListener('click', startDownload);
        } catch (err) {
            console.error('[TurboLoader] init:', err);
            showError('Could not probe the file. Make sure the URL with ?turbo=0 is reachable.');
            startBtn.textContent = 'Standard Download';
            startBtn.onclick = () => { window.location.href = originUrl; };
        }
    }

    // ── main download ──────────────────────────────────────────────────────────
    async function startDownload() {
        if (activeDownload) return;
        startBtn.disabled = true;
        errorMsgEl.style.display = 'none';
        saveBtnEl.style.display = 'none';
        if (pendingBlobUrl) { URL.revokeObjectURL(pendingBlobUrl); pendingBlobUrl = null; }

        let writableStream = null;
        let isFallback = false;

        // Attempt File System Access API (Chrome/Edge — writes directly to disk)
        if (window.showSaveFilePicker) {
            try {
                const fh = await window.showSaveFilePicker({ suggestedName: filename });
                writableStream = await fh.createWritable();
            } catch (err) {
                if (err.name === 'AbortError') { startBtn.disabled = false; return; }

                // Brave/Firefox Shields or other security policy blocks the API
                if (err.name === 'SecurityError' || err.name === 'NotAllowedError') {
                    // Check file size BEFORE continuing: prevent Blob crash for large files
                    if (totalSize > 1.2 * 1024 * 1024 * 1024) {
                        shieldsWarnEl.innerHTML =
                            '🚫 <strong>Direct-To-Disk is blocked by Brave Shields</strong><br>' +
                            'This file (>1.2 GB) is too large for the RAM fallback and will cause a Browser "Network Error" when saving.<br><br>' +
                            '👉 <strong>Action required:</strong> Click the Lion icon (top right), lower Shields to "Standard", and reload the page.';
                        shieldsWarnEl.style.display = 'block';
                        shieldsWarnEl.style.background = 'rgba(239, 68, 68, 0.15)';
                        shieldsWarnEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
                        shieldsWarnEl.style.color = '#fca5a5';
                        startBtn.disabled = true;
                        startBtn.style.display = 'none';
                        standardBtnEl.style.display = 'block';
                        return; // Halt download
                    }

                    shieldsWarnEl.innerHTML =
                        '🛡️ <strong>Browser Shields blockieren Direct-to-Disk saving.</strong><br>' +
                        'Die Datei wird komplett im Arbeitsspeicher (RAM) geladen. Ein "Speichern"-Button erscheint nach Abschluss.<br>' +
                        '<small>Tipp: Schalte für echte Performance die Brave-Shields für diese Seite auf Standard.</small>';
                    shieldsWarnEl.style.display = 'block';
                } else {
                    console.warn('[TurboLoader] FSFA error (', err.name, '):', err.message);
                }
                isFallback = true;
            }
        } else {
            isFallback = true;
        }

        // For non-FSFA browsers (Firefox etc), also apply 1.2 GB limit
        if (isFallback && totalSize > 1.2 * 1024 * 1024 * 1024) {
            shieldsWarnEl.innerHTML =
                '🚫 <strong>Browser does not support Direct-To-Disk</strong><br>' +
                'This file (>1.2 GB) is too large to be fully buffered in RAM. Your browser will crash with a "Network Error".<br><br>' +
                '👉 Please use the standard download instead.';
            shieldsWarnEl.style.display = 'block';
            shieldsWarnEl.style.background = 'rgba(239, 68, 68, 0.15)';
            shieldsWarnEl.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            shieldsWarnEl.style.color = '#fca5a5';
            startBtn.disabled = true;
            startBtn.style.display = 'none';
            standardBtnEl.style.display = 'block';
            return;
        }

        // Warn user if Blob fallback will buffer a huge file in RAM
        const SAFE_BLOB_LIMIT = 512 * 1024 * 1024; // 512 MB
        if (isFallback && totalSize > SAFE_BLOB_LIMIT) {
            const go = window.confirm(
                `Your browser does not support direct-to-disk saving.\n\n` +
                `This file is ${formatBytes(totalSize)} and must be fully buffered in RAM first.\n` +
                `This may crash the tab for very large files.\n\nContinue anyway?`
            );
            if (!go) { startBtn.disabled = false; return; }
        }

        startBtn.textContent = 'Downloading...';

        const chunkSize = Math.ceil(totalSize / CHUNK_COUNT);
        const completedChunks = new Array(CHUNK_COUNT).fill(null);
        const controller = new AbortController();
        activeDownload = controller;
        let writeQueue = Promise.resolve();
        let downloadedBytes = 0;
        let lastTime = Date.now();
        let lastBytes = 0;
        const MAX_ATTEMPTS = 5;

        function fatal(message) {
            const error = new Error(message);
            error.permanent = true;
            return error;
        }

        function retryDelay(delay) {
            return new Promise((resolve, reject) => {
                if (controller.signal.aborted) { reject(new Error('Download cancelled')); return; }
                const cancel = () => { clearTimeout(timer); reject(new Error('Download cancelled')); };
                const timer = setTimeout(() => {
                    controller.signal.removeEventListener('abort', cancel);
                    resolve();
                }, delay);
                controller.signal.addEventListener('abort', cancel, { once: true });
            });
        }

        function updateProgress() {
            const now = Date.now();
            if (now - lastTime < 400) return;
            const speed = (downloadedBytes - lastBytes) / ((now - lastTime) / 1000);
            if (speed > 0) {
                speedEl.textContent = `${formatBytes(speed)}/s`;
                const eta = Math.max(0, Math.round((totalSize - downloadedBytes) / speed));
                etaEl.textContent = `${String(Math.floor(eta / 60)).padStart(2, '0')}:${String(eta % 60).padStart(2, '0')}`;
            }
            const percent = (downloadedBytes / totalSize) * 100;
            percentEl.textContent = `${percent.toFixed(1)}%`;
            progressEl.style.width = `${percent}%`;
            lastTime = now;
            lastBytes = downloadedBytes;
        }

        async function downloadChunk(idx) {
            const start = idx * chunkSize;
            const end = Math.min(start + chunkSize - 1, totalSize - 1);
            if (start >= totalSize) return;
            const chunkTotal = end - start + 1;
            const fillEl = document.getElementById(`chunk-${idx}`);
            const pieces = [];
            let chunkGot = 0;

            for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                if (controller.signal.aborted) throw new Error('Download cancelled');
                if (attempt > 0) {
                    fillEl.style.background = '#f59e0b';
                    await retryDelay(Math.min(1000 * 2 ** (attempt - 1), 30000));
                }
                const requestController = new AbortController();
                const cancelRequest = () => requestController.abort();
                controller.signal.addEventListener('abort', cancelRequest, { once: true });
                let timeout = setTimeout(cancelRequest, 60000);
                let reader;
                try {
                    const resumeFrom = start + chunkGot;
                    const headers = { Range: `bytes=${resumeFrom}-${end}` };
                    if (fileValidator) headers['If-Range'] = fileValidator;
                    const res = await fetch(originUrl, { headers, signal: requestController.signal });
                    if (res.status !== 206) {
                        if (res.status === 200 || (res.status >= 400 && res.status < 500 && ![408, 429].includes(res.status))) {
                            throw fatal(`Server returned HTTP ${res.status} instead of the requested file range. Use Standard Download.`);
                        }
                        throw new Error(`HTTP ${res.status}`);
                    }
                    const expectedRange = `bytes ${resumeFrom}-${end}/${totalSize}`;
                    if (res.headers.get('Content-Range') !== expectedRange || !res.body) {
                        throw fatal('Server returned an unexpected file range. Use Standard Download.');
                    }
                    reader = res.body.getReader();
                    while (true) {
                        const { done, value } = await reader.read();
                        clearTimeout(timeout);
                        if (done) break;
                        timeout = setTimeout(cancelRequest, 60000);
                        if (chunkGot + value.length > chunkTotal) throw fatal('Server returned too many bytes for a file range.');
                        if (isFallback) {
                            pieces.push(value);
                        } else {
                            // Await each queued write: memory stays bounded by the active network reads.
                            const position = start + chunkGot;
                            writeQueue = writeQueue.then(() => writableStream.write({ type: 'write', position, data: value }));
                            try { await writeQueue; } catch (error) { throw fatal(`Could not write the download: ${error.message}`); }
                        }
                        chunkGot += value.length;
                        downloadedBytes += value.length;
                        fillEl.style.background = '#38bdf8';
                        fillEl.style.width = `${(chunkGot / chunkTotal) * 100}%`;
                        updateProgress();
                    }
                    if (chunkGot !== chunkTotal) throw new Error('File range ended before all bytes arrived.');
                    if (isFallback) completedChunks[idx] = new Blob(pieces);
                    return;
                } catch (error) {
                    if (error.permanent || controller.signal.aborted || attempt === MAX_ATTEMPTS - 1) throw error;
                    // A transport error after the last expected byte does not require an invalid extra Range request.
                    if (chunkGot === chunkTotal) {
                        if (isFallback) completedChunks[idx] = new Blob(pieces);
                        return;
                    }
                } finally {
                    clearTimeout(timeout);
                    controller.signal.removeEventListener('abort', cancelRequest);
                    requestController.abort();
                    if (reader) { try { await reader.cancel(); } catch (_) {} }
                }
            }
        }

        const downloads = Array.from({ length: CHUNK_COUNT }, (_, i) => downloadChunk(i));
        try {
            await Promise.all(downloads);
            if (!isFallback) {
                await writableStream.close();
            } else {
                const blob = new Blob(completedChunks.filter(Boolean));
                pendingBlobUrl = URL.createObjectURL(blob);
                pendingFilename = filename;
                saveBtnEl.style.display = 'block';
                saveBtnEl.textContent = `💾 Save ${filename} (${formatBytes(blob.size)})`;
            }
            percentEl.textContent = '100%';
            progressEl.style.width = '100%';
            speedEl.textContent = 'Completed';
            etaEl.textContent = '00:00';
            startBtn.textContent = 'Download Complete! 🎉';
            startBtn.disabled = false;
        } catch (error) {
            controller.abort();
            await Promise.allSettled(downloads);
            if (writableStream) { try { await writableStream.abort(); } catch (_) {} }
            standardBtnEl.style.display = 'block';
            showError('Download failed: ' + error.message);
        } finally {
            activeDownload = null;
        }
    }

    init();
</script>
</body>
</html>
