<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShieldPM RDP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: #111;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }

        #status-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 32px;
            background: #1a1a2e;
            display: flex; align-items: center; gap: 8px;
            padding: 0 12px;
            font-size: 12px; color: #eee;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }

        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            flex-shrink: 0;
        }
        .dot.connecting  { background: #fbbf24; animation: pulse 1s infinite; }
        .dot.connected   { background: #4ade80; }
        .dot.disconnected, .dot.error { background: #ef4444; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        #actions {
            margin-left: auto;
            display: flex; gap: 6px; align-items: center;
        }
        #actions button {
            background: #2d2d44; border: 1px solid #444; color: #ccc;
            padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
        }
        #actions button:hover { background: #3d3d5c; }

        #display-wrap {
            position: fixed;
            top: 32px; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            background: #000;
            display: flex; align-items: flex-start; justify-content: flex-start;
        }

        /* guacamole-common-js inserts a <div> containing a <canvas> */
        #display-wrap > div {
            transform-origin: top left;
        }

        #error-overlay {
            position: fixed; inset: 32px 0 0 0;
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
            background: #0a0a0a; color: #ef4444;
            font-size: 14px; gap: 12px;
        }
        #error-overlay.show { display: flex; }
        #error-overlay pre {
            max-width: 600px; text-align: center;
            white-space: pre-wrap; word-break: break-word;
            font-size: 12px; color: #f87171;
        }
        #error-overlay button {
            background: #1a1a2e; border: 1px solid #444; color: #ccc;
            padding: 6px 16px; border-radius: 4px; cursor: pointer;
        }

        /* Clipboard toast */
        #clip-toast {
            position: fixed; bottom: 16px; right: 16px;
            background: #1a1a2e; border: 1px solid #4ade80; color: #4ade80;
            padding: 6px 14px; border-radius: 6px; font-size: 12px;
            opacity: 0; transition: opacity .3s;
            pointer-events: none; z-index: 2000;
        }
        #clip-toast.show { opacity: 1; }
    </style>
</head>
<body>

<div id="status-bar">
    <span id="dot" class="dot connecting"></span>
    <span id="status-text">Connecting…</span>
    <div id="actions">
        <button id="btn-fs"          title="Fullscreen">⛶</button>
        <button id="btn-reconnect"   title="Reconnect">↺</button>
        <button id="btn-disconnect"  title="Disconnect">■</button>
    </div>
</div>

<div id="display-wrap"></div>

<div id="error-overlay">
    <span>Connection error</span>
    <pre id="error-msg"></pre>
    <button id="btn-retry">Reconnect</button>
</div>

<div id="clip-toast">Clipboard synced</div>

<!-- Guacamole JS client — downloaded to container during build/update -->
<script src="/guacamole-common.min.js"></script>

<script>
(function () {
    'use strict';

    // ── DOM refs ──────────────────────────────────────────
    const wrap      = document.getElementById('display-wrap');
    const dot       = document.getElementById('dot');
    const stText    = document.getElementById('status-text');
    const errOver   = document.getElementById('error-overlay');
    const errMsg    = document.getElementById('error-msg');
    const clipToast = document.getElementById('clip-toast');

    // ── State ─────────────────────────────────────────────
    let client   = null;
    let tunnel   = null;
    let mouse    = null;
    let keyboard = null;
    let toastTimer = null;

    // ── Helpers ───────────────────────────────────────────
    function setStatus(s, msg) {
        dot.className = 'dot ' + s;
        stText.textContent = {
            connecting:   'Connecting…',
            connected:    'Connected',
            disconnected: 'Disconnected',
            error:        'Error',
        }[s] || s;

        if (s === 'error') {
            errMsg.textContent = msg || '';
            errOver.classList.add('show');
        } else {
            errOver.classList.remove('show');
        }
    }

    function showClipToast() {
        clearTimeout(toastTimer);
        clipToast.classList.add('show');
        toastTimer = setTimeout(() => clipToast.classList.remove('show'), 2000);
    }

    // ── Scale canvas to fill the viewport below the status bar ──
    function scaleDisplay() {
        if (!client) return;
        const display = client.getDisplay();
        const rw = display.getWidth();
        const rh = display.getHeight();
        if (!rw || !rh) return;

        const vw = wrap.clientWidth;
        const vh = wrap.clientHeight;
        const scale = Math.min(vw / rw, vh / rh, 1); // never upscale beyond 1:1
        display.scale(scale);
    }

    window.addEventListener('resize', scaleDisplay);

    // ── Connect ───────────────────────────────────────────
    function connect() {
        // Tear down previous session
        if (keyboard) { keyboard.onkeydown = keyboard.onkeyup = null; keyboard = null; }
        if (mouse)    { mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = mouse.onmouseout = null; mouse = null; }
        if (client)   { try { client.disconnect(); } catch (_) {} client = null; }
        wrap.innerHTML = '';

        setStatus('connecting');

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl  = `${proto}//${location.host}/ws`;

        tunnel = new Guacamole.WebSocketTunnel(wsUrl);
        client = new Guacamole.Client(tunnel);

        // Add the display canvas to the DOM
        const displayEl = client.getDisplay().getElement();
        wrap.appendChild(displayEl);

        // ── Tunnel state ──
        tunnel.onstatechange = (state) => {
            switch (state) {
                case Guacamole.Tunnel.State.CONNECTING:
                    setStatus('connecting'); break;
                case Guacamole.Tunnel.State.OPEN:
                    setStatus('connected'); break;
                case Guacamole.Tunnel.State.CLOSED:
                    setStatus('disconnected'); break;
                case Guacamole.Tunnel.State.UNSTABLE:
                    setStatus('connecting', 'Reconnecting…'); break;
            }
        };

        // ── Client events ──
        client.onerror = (error) => {
            setStatus('error', error ? error.message : 'Unknown error');
        };

        // Scale canvas once we know the remote desktop size
        client.getDisplay().onresize = () => scaleDisplay();

        // Clipboard: remote → local
        client.onclipboard = (stream, mimetype) => {
            if (!mimetype.startsWith('text/')) return;
            const reader = new Guacamole.StringReader(stream);
            let text = '';
            reader.ontext = (chunk) => { text += chunk; };
            reader.onend  = () => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text)
                        .then(showClipToast)
                        .catch(() => {});
                }
            };
        };

        // ── Clipboard: local → remote (on focus/paste) ──
        document.addEventListener('paste', (e) => {
            if (!client) return;
            const text = e.clipboardData && e.clipboardData.getData('text/plain');
            if (!text) return;
            const stream = client.createClipboardStream('text/plain');
            const writer = new Guacamole.StringWriter(stream);
            writer.sendText(text);
            writer.sendEnd();
            showClipToast();
        });

        // ── Mouse input ──
        mouse = new Guacamole.Mouse(displayEl);

        function sendMouse(state) {
            if (!client) return;
            // Map display coordinates to remote desktop coordinates
            const display = client.getDisplay();
            const scale   = display.getScale() || 1;
            const adjusted = new Guacamole.Mouse.State(
                state.x / scale,
                state.y / scale,
                state.left,
                state.middle,
                state.right,
                state.up,
                state.down,
            );
            client.sendMouseState(adjusted);
        }

        mouse.onmousedown  = sendMouse;
        mouse.onmouseup    = sendMouse;
        mouse.onmousemove  = sendMouse;
        mouse.onmouseout   = sendMouse;

        // ── Touch input — map to mouse ──
        const touch = new Guacamole.Mouse.Touchscreen(displayEl);
        touch.onmousedown = touch.onmouseup = touch.onmousemove = sendMouse;

        // ── Keyboard input ──
        keyboard = new Guacamole.Keyboard(document);

        keyboard.onkeydown = (keysym) => {
            if (!client) return;
            client.sendKeyEvent(1, keysym);
        };
        keyboard.onkeyup = (keysym) => {
            if (!client) return;
            client.sendKeyEvent(0, keysym);
        };

        // ── Start session ──
        // Pass viewport dimensions so guacd requests the right resolution from Windows
        const vw = wrap.clientWidth  || 1280;
        const vh = wrap.clientHeight || 800;
        client.connect(`width=${vw}&height=${vh}`);
    }

    // ── Toolbar buttons ───────────────────────────────────
    document.getElementById('btn-fs').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    document.getElementById('btn-reconnect').addEventListener('click', connect);
    document.getElementById('btn-retry').addEventListener('click', connect);

    document.getElementById('btn-disconnect').addEventListener('click', () => {
        if (client) { try { client.disconnect(); } catch (_) {} client = null; }
        setStatus('disconnected');
    });

    // ── Start ─────────────────────────────────────────────
    connect();

})();
</script>
</body>
</html>
