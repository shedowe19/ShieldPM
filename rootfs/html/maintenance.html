<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            /* Dark/Premium Theme */
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;

            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-accent: #c4b5fd;

            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary-glow: rgba(6, 182, 212, 0.3);

            --btn-bg: #7c3aed;
            --btn-text: #ffffff;
            --btn-hover: #6d28d9;
        }

        /* Light Theme Adaptation */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-gradient-start: #f1f5f9;
                --bg-gradient-end: #e2e8f0;
                --card-bg: rgba(255, 255, 255, 0.7);
                --card-border: rgba(255, 255, 255, 0.6);
                --text-primary: #1e293b;
                --text-secondary: #64748b;
                --text-accent: #6366f1;
                --btn-bg: #4f46e5;
                --btn-text: #ffffff;
                --btn-hover: #4338ca;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top center, var(--bg-gradient-end), var(--bg-gradient-start));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* Ambient Background Effects */
        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 25s infinite ease-in-out;
        }

        .orb-1 {
            background: var(--primary-glow);
            width: 60vh;
            height: 60vh;
            top: -20%;
            left: -10%;
        }

        .orb-2 {
            background: var(--secondary-glow);
            width: 50vh;
            height: 50vh;
            bottom: -10%;
            right: -10%;
            animation-delay: -10s;
        }

        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 3.5rem 3rem;
            border-radius: 2rem;
            box-shadow:
                0 20px 40px -10px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 32rem;
            width: 90%;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            /* Dark mode compatible glass frame */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-accent);
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #fbbf24;
            /* Amber for Warning/Maintenance */
            border-radius: 50%;
            box-shadow: 0 0 8px #fbbf24;
            animation: blink 2s infinite ease-in-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-border), transparent);
            margin: 2rem 0;
            width: 100%;
        }

        /* Interactive Elements */
        .retry-btn {
            background: var(--btn-bg);
            color: var(--btn-text) !important;
            border: none;
            padding: 0.9rem 2.8rem;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px -6px rgba(124, 58, 237, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .retry-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -8px rgba(124, 58, 237, 0.5);
        }

        .retry-btn svg {
            transition: transform 0.5s ease;
        }

        .retry-btn:hover svg {
            transform: rotate(180deg);
        }

        .footer {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .timer-text {
            font-variant-numeric: tabular-nums;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            display: block;
            opacity: 0.8;
        }

        /* Animations */
        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, -20px);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Service Unreachable</span>
        </div>

        <h1>Under Maintenance</h1>

        <p>
            We are currently experiencing connectivity issues with the upstream service.
            This could be due to scheduled maintenance or a temporary outage.
        </p>

        <p style="font-size: 0.95rem; opacity: 0.8;">
            The system administrator has been notified.
            Please try again in a few moments.
        </p>

        <div class="divider"></div>

        <button class="retry-btn" onclick="window.location.reload()">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4v5h.058M20 20v-5h-.058M4.05 9a9 9 0 0115.3-3.6M19.95 15a9 9 0 01-15.3 3.6" />
            </svg>
            <span>Reload Page</span>
        </button>

        <!-- Optional Javascript for Auto-Reload timer or similar feel -->
        <script>
            // Simple visual effect purely
        </script>

        <div class="footer">
            <span>Powered by <strong>NPMplus</strong></span>
            <span>&bull;</span>
            <span id="timestamp">Checked: --:--</span>
        </div>
    </div>

    <script>
        // Update timestamp label to make it feel responsive
        const now = new Date();
        document.getElementById('timestamp').innerText = 'Checked: ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    </script>
</body>

</html>
