<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            /* Palette: Deep Space / Nebula */
            --bg-dark: #020617;
            --bg-light: #0f172a;

            --card-glass: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --accent-primary: #8b5cf6;
            /* Violet */
            --accent-secondary: #06b6d4;
            /* Cyan */
            --accent-warn: #fbbf24;
            /* Amber */

            --btn-grad-start: #7c3aed;
            --btn-grad-end: #6d28d9;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-dark: #f0f9ff;
                --bg-light: #e0f2fe;
                --card-glass: rgba(255, 255, 255, 0.7);
                --card-border: rgba(255, 255, 255, 0.6);
                --text-main: #0f172a;
                --text-muted: #64748b;
                --accent-primary: #6366f1;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background with Noise */
        .bg-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--accent-primary);
            opacity: 0.2;
            top: -20%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--accent-secondary);
            opacity: 0.15;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            padding: 3rem;
            border-radius: 24px;
            background: var(--card-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Hero Icon Animation */
        .hero-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
            animation: pulse-ring 3s infinite;
        }

        .hero-svg {
            width: 40px;
            height: 40px;
            color: var(--accent-primary);
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }

        /* Typography */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        /* Status Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: var(--accent-warn);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
            animation: blink 2s infinite;
        }

        /* Primary Button */
        .btn-reload {
            appearance: none;
            border: none;
            outline: none;
            background: linear-gradient(135deg, var(--btn-grad-start), var(--btn-grad-end));
            color: white;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            padding: 1rem 2.5rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.3, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-reload:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            filter: brightness(1.1);
        }

        .btn-reload:active {
            transform: translateY(0);
        }

        .btn-reload svg {
            width: 20px;
            height: 20px;
            transition: transform 0.5s ease;
        }

        .btn-reload:hover svg {
            transform: rotate(180deg);
        }

        /* Footer */
        .footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(30px, -30px);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0.4;
            }
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.2;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="bg-noise"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
        <div class="badge">
            <div class="dot"></div>
            <span>Service Unreachable</span>
        </div>

        <div class="hero-icon">
            <div class="hero-circle"></div>
            <!-- Network/Disconnect Icon -->
            <svg class="hero-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h1>Under Maintenance</h1>

        <p>
            The upstream service is currently paused or unreachable.<br>
            Please check back in a few moments.
        </p>

        <button class="btn-reload" onclick="window.location.reload()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4v5h.058M20 20v-5h-.058M4.05 9a9 9 0 0115.3-3.6M19.95 15a9 9 0 01-15.3 3.6" />
            </svg>
            Reload Page
        </button>

        <div class="footer">
            <span>Powered by <strong>NPMplus</strong></span>
            <span id="timestamp">--:--:--</span>
        </div>
    </div>

    <script>
        document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();
    </script>
</body>

</html>
