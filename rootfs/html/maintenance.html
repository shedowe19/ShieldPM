<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #334155;
            --card-bg: rgba(30, 41, 59, 0.4);
            /* Much more transparent */
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --btn-bg: #8b5cf6;
            --btn-text: #ffffff;
            --btn-hover: #7c3aed;
        }

        /* Light mode override only if explicitly needed, but preserving dark aesthetic generally looks more "premium" for error pages */
        @media (prefers-color-scheme: light) {

            /* We stick to a dark/glass theme even in light mode for the "premium" feel, 
                but let's make it slightly lighter so it's not jarring */
            :root {
                --bg-gradient-start: #e2e8f0;
                --bg-gradient-end: #f8fafc;
                --card-bg: rgba(255, 255, 255, 0.65);
                --card-border: rgba(255, 255, 255, 0.8);
                --text-primary: #1e293b;
                --text-secondary: #475569;
                --btn-bg: #6366f1;
                --btn-text: #ffffff;
                --btn-hover: #4f46e5;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* Floating Orbs Background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #4f46e5;
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #ec4899;
            bottom: -20%;
            right: -10%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #06b6d4;
            top: 40%;
            left: 30%;
            opacity: 0.4;
            animation-delay: -12s;
        }

        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            padding: 4rem 3rem;
            border-radius: 2rem;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 30rem;
            width: 90%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .icon-wrapper {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem auto;
            box-shadow: 0 0 30px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-wrapper svg {
            width: 45px;
            height: 45px;
            color: var(--text-primary);
            animation: pulse 3s infinite;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 3rem;
            font-weight: 500;
        }

        .retry-btn {
            background: var(--btn-bg);
            color: var(--btn-text) !important;
            /* Force white text */
            border: none;
            padding: 1rem 3rem;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .retry-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .retry-btn:active {
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            opacity: 0.5;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(30px, -50px);
            }

            66% {
                transform: translate(-20px, 20px);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(0.95);
            }
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1>Under Maintenance</h1>

        <p>
            The service is currently unavailable.<br>
            Our team is working to restore it shortly.
        </p>

        <button class="retry-btn" onclick="window.location.reload()">
            <span>Reload Page</span>
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4v5h.058M20 20v-5h-.058M4.05 9a9 9 0 0115.3-3.6M19.95 15a9 9 0 01-15.3 3.6" />
            </svg>
        </button>

        <div class="footer">
            Powered by NPMplus
        </div>
    </div>
</body>

</html>
