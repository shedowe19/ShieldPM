<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-dark: #030712;
            --card-glass: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-primary: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.15);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-dark: #f8fafc;
                --card-glass: rgba(255, 255, 255, 0.85);
                --card-border: rgba(0, 0, 0, 0.05);
                --text-main: #0f172a;
                --text-muted: #64748b;
                --accent-primary: #6366f1;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Sophisticated Background */
        .ambient-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.1), transparent 25%);
            z-index: 0;
            pointer-events: none;
        }

        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.5;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 520px;
            padding: 3.5rem;
            border-radius: 32px;
            background: var(--card-glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 32px 64px -16px rgba(0, 0, 0, 0.4);
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateY(20px);
        }

        /* Icon Graphic */
        .status-graphic {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent-primary);
            opacity: 0;
            animation: ripple 3s infinite cubic-bezier(0, 0, 0.2, 1);
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-primary), #6d28d9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--accent-glow);
            z-index: 2;
        }

        .icon-circle svg {
            color: white;
            width: 32px;
            height: 32px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        /* Connecting Lines Visualization */
        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.7;
        }

        .node {
            width: 8px;
            height: 8px;
            background: #374151;
            border-radius: 50%;
            position: relative;
        }

        .node.active {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .node.error {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .line {
            height: 2px;
            flex: 1;
            max-width: 60px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .line-dot {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, white, transparent);
            transform: translateX(-100%);
            animation: traverse 2s infinite ease-in-out;
            opacity: 0.2;
        }

        /* Button */
        .btn-primary {
            background: #f8fafc;
            color: #0f172a;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(255, 255, 255, 0.15);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        @keyframes traverse {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(200%);
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>
    <div class="grid-overlay"></div>

    <div class="card">
        <div class="status-graphic">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="icon-circle">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
                </svg>
            </div>
        </div>

        <h1>System Unreachable</h1>

        <p>
            We're unable to establish a connection to the upstream server.<br>
            It might be down for maintenance or experiencing high traffic.
        </p>

        <div class="connection-status">
            <div class="node active" title="You"></div>
            <div class="line">
                <div class="line-dot"></div>
            </div>
            <div class="node active" title="Proxy"></div>
            <div class="line">
                <div class="line-dot"></div>
            </div>
            <div class="node error" title="Upstream (Down)"></div>
        </div>

        <button class="btn-primary" onclick="window.location.reload()">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4v5h.058M20 20v-5h-.058M4.05 9a9 9 0 0115.3-3.6M19.95 15a9 9 0 01-15.3 3.6" />
            </svg>
            Reconnect
        </button>

        <div class="footer">
            Reference ID: 502_BAD_GATEWAY
        </div>
    </div>
</body>

</html>
