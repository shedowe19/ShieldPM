<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="application-name" content="ShieldPM" />
  <meta name="description" content="Default Page of ShieldPM" />
  <meta name="keywords" content="ShieldPM, default" />
  <title>Congratulations!</title>
  <style>
    body {
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
      color: #333;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      text-align: center;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #28a745;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    #notice {
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: 40px;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1a1a1a;
        color: #e0e0e0;
      }

      .container {
        background-color: #2d2d2d;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: #4cd964;
      }

      #notice {
        color: #adb5bd;
      }

      a {
        color: #4da3ff;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Congratulations!</h1>
    <p>You've successfully started ShieldPM.</p>
    <p>If you're seeing this page, it means you haven't configured a host for this domain yet.</p>
    <p id="notice">Powered by <a href="https://github.com/shedowe19/ShieldPM">ShieldPM</a></p>
  </div>
</body>

</html>
